    :root {
      --bg: #0a0e1a;
      --surface: rgba(16, 21, 38, 0.9);
      --surface2: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8ecf5;
      --text2: #8b95ab;
      --accent: #6366f1;
      --accent2: #8b5cf6;
      --pink: #ec4899;
      --green: #10b981;
      --red: #f43f5e;
      --gold: #f59e0b;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      background: var(--bg); color: var(--text); min-height: 100%; overflow-x: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px;
    }
    body {
      background: transparent;
      padding: calc(14px + var(--top-space, 0px)) calc(16px + var(--safe-right, 0px))
        calc(28px + var(--safe-bottom, 0px)) calc(16px + var(--safe-left, 0px));
    }
    .bg-wrap {
      position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
      background:
        linear-gradient(180deg, rgba(6, 9, 20, 0.66) 0%, rgba(6, 9, 20, 0.55) 45%, rgba(6, 9, 20, 0.82) 100%),
        url("?asset=bg") center / cover no-repeat, var(--bg);
    }
    #app { max-width: 520px; margin: 0 auto; transition: opacity .25s; }
    html.tg-shell-pending #app { opacity: 0; }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
    input { font: inherit; }
    .muted { color: var(--text2); }

    .hero { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .hero-ic {
      width: 48px; height: 48px; border-radius: 15px; flex-shrink: 0; display: grid; place-items: center; font-size: 22px; color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 8px 22px rgba(99, 102, 241, .35);
    }
    .hero h1 { font-size: 19px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; }
    .hero p { font-size: 12.5px; color: var(--text2); margin-top: 2px; }

    .chips { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
      background: var(--surface); border: 1px solid var(--border);
    }
    .chip b { color: #fff; }
    .chip.ok .bi { color: var(--green); }
    .chip.low { border-color: rgba(245, 158, 11, .4); }
    .chip.low .bi { color: var(--gold); }

    .steps { display: flex; gap: 5px; margin-bottom: 14px; }
    .step { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .step { flex: 1; text-align: center; font-size: 11.5px; font-weight: 600; color: var(--text2); }
    .step .bar { height: 4px; border-radius: 4px; background: var(--surface2); margin-bottom: 6px; overflow: hidden; }
    .step .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .35s; }
    .step.done .bar i, .step.active .bar i { width: 100%; }
    .step.active { color: var(--text); }
    .step.done { color: var(--green); }

    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
    }
    .card h2 { font-size: 16px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .card p { font-size: 13.5px; line-height: 1.5; color: var(--text2); }
    .card p + p { margin-top: 6px; }

    label.lbl { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin: 12px 0 6px; }
    .field { position: relative; }
    .field input {
      width: 100%; height: 48px; padding: 0 14px; border-radius: 13px; outline: none;
      background: rgba(0, 0, 0, .25); border: 1px solid var(--border); color: var(--text); font-size: 15px;
    }
    .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99, 102, 241, .2); }
    .field input.code { text-align: center; font-size: 24px; font-weight: 700; letter-spacing: .35em; font-variant-numeric: tabular-nums; }
    .field .eye { position: absolute; right: 6px; top: 6px; width: 36px; height: 36px; border-radius: 10px; color: var(--text2); font-size: 17px; }
    .field .eye + input, .field input.has-eye { padding-right: 46px; }
    .rules { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; font-size: 12px; color: var(--text2); }
    .rules span { display: inline-flex; align-items: center; gap: 4px; }
    .rules span.ok { color: var(--green); }

    .email-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 5px 10px; border-radius: 999px; background: var(--surface2); margin-top: 8px; word-break: break-all; }

    .notice { display: flex; gap: 10px; padding: 12px 13px; border-radius: 13px; font-size: 13px; line-height: 1.45; margin-bottom: 12px; }
    .notice .bi { font-size: 17px; line-height: 1.2; flex-shrink: 0; }
    .notice.info { background: rgba(99, 102, 241, .1); border: 1px solid rgba(99, 102, 241, .28); }
    .notice.info .bi { color: #a5b4fc; }
    .notice.warn { background: rgba(245, 158, 11, .1); border: 1px solid rgba(245, 158, 11, .32); }
    .notice.warn .bi { color: var(--gold); }
    .notice.err { background: rgba(244, 63, 94, .1); border: 1px solid rgba(244, 63, 94, .32); }
    .notice.err .bi { color: var(--red); }
    .notice.ok { background: rgba(16, 185, 129, .1); border: 1px solid rgba(16, 185, 129, .32); }
    .notice.ok .bi { color: var(--green); }

    .check { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; line-height: 1.45; margin-top: 12px; cursor: pointer; }
    .check input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--accent); flex-shrink: 0; }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px;
      padding: 13px; border-radius: 14px; font-weight: 700; background: var(--surface2); border: 1px solid var(--border);
    }
    .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; color: #fff; }
    .btn.green { background: linear-gradient(135deg, var(--green), #059669); border-color: transparent; color: #fff; }
    .btn.ghost { background: transparent; border-color: transparent; color: var(--text2); font-weight: 600; min-height: 44px; }
    .btn.danger { background: rgba(244, 63, 94, .12); border-color: rgba(244, 63, 94, .32); color: var(--red); }
    .btn:disabled { opacity: .5; }
    .btn + .btn { margin-top: 8px; }
    .card .btn:first-of-type { margin-top: 14px; }
    .btn.busy { position: relative; color: transparent !important; pointer-events: none; }
    .btn.busy::after {
      content: ""; position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, .25); border-top-color: #fff; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg) } }

    .state { text-align: center; padding: 26px 8px 6px; }
    .state .big { width: 72px; height: 72px; border-radius: 22px; margin: 0 auto 14px; display: grid; place-items: center; font-size: 32px; }
    .state .big.ok { background: rgba(16, 185, 129, .14); color: var(--green); }
    .state .big.warn { background: rgba(245, 158, 11, .14); color: var(--gold); }
    .state .big.err { background: rgba(244, 63, 94, .14); color: var(--red); }
    .state h2 { font-size: 18px; margin-bottom: 8px; }
    .state p { font-size: 13.5px; color: var(--text2); line-height: 1.5; margin-bottom: 18px; }

    .skeleton { border-radius: 14px; height: 54px; margin-bottom: 10px; background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }
    .fade-in { animation: fade .25s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade-in, .skeleton { animation: none; } }
    /* ---- muvaffaqiyat: kabinetdagi "to'lov qabul qilindi" bilan bir xil uslub */
    .cel {
      position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px;
      padding-top: calc(24px + var(--top-space, 0px)); padding-bottom: calc(24px + var(--safe-bottom, 0px));
      background: radial-gradient(circle at 50% 38%, rgba(16, 185, 129, .28), rgba(5, 8, 18, .9) 62%);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      animation: fade .2s both; overflow: hidden;
    }
    .cel.closing { animation: celOut .2s both; }
    .cel-card { position: relative; width: 100%; max-width: 340px; text-align: center; animation: celPop .55s cubic-bezier(.2, 1.3, .35, 1) .05s both; }
    .cel-ring { position: relative; width: 124px; height: 124px; margin: 0 auto 22px; }
    .cel-ring::before, .cel-ring::after {
      content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(16, 185, 129, .55);
      animation: celWave 1.8s ease-out .35s infinite;
    }
    .cel-ring::after { animation-delay: 1.25s; }
    .cel-ring svg { position: relative; width: 100%; height: 100%; filter: drop-shadow(0 10px 30px rgba(16, 185, 129, .55)); }
    .cel-ring .disc { fill: url(#celGrad); transform-origin: center; animation: celDisc .5s cubic-bezier(.2, 1.4, .4, 1) .1s both; }
    .cel-ring .tick { fill: none; stroke: #fff; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; animation: celTick .45s cubic-bezier(.65, 0, .35, 1) .5s forwards; }
    .cel-title { font-size: 15px; font-weight: 700; color: #a7f3d0; letter-spacing: .02em; text-transform: uppercase; animation: celIn .4s ease .55s both; }
    .cel-head {
      margin: 8px 0 8px; font-size: 26px; line-height: 1.15; font-weight: 800; letter-spacing: -.01em;
      background: linear-gradient(135deg, #ecfdf5, #6ee7b7 55%, #34d399); -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: celIn .45s ease .65s both;
    }
    .cel-mail { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2); word-break: break-all; animation: celIn .45s ease .72s both; }
    .cel-rows { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; animation: celIn .45s ease .82s both; }
    .cel-pill { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 99px; background: rgba(255, 255, 255, .08); border: 1px solid var(--border); font-size: 13px; color: var(--text2); }
    .cel-pill b { color: var(--text); font-variant-numeric: tabular-nums; }
    .cel .btn { margin-top: 24px; animation: celIn .45s ease .95s both; }
    .cel-confetti { position: absolute; left: 50%; top: 38%; width: 0; height: 0; pointer-events: none; }
    .cel-confetti i {
      position: absolute; left: 0; top: 0; width: 9px; height: 14px; border-radius: 2px; opacity: 0;
      animation: celBurst var(--t, 1.6s) cubic-bezier(.15, .7, .3, 1) var(--d, 0s) forwards;
    }
    .cel-confetti i.dot { width: 8px; height: 8px; border-radius: 50%; }
    @keyframes celPop { from { opacity: 0; transform: translateY(24px) scale(.9) } to { opacity: 1; transform: none } }
    @keyframes celIn { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
    @keyframes celOut { to { opacity: 0 } }
    @keyframes celDisc { from { transform: scale(0) } to { transform: scale(1) } }
    @keyframes celTick { to { stroke-dashoffset: 0 } }
    @keyframes celWave { 0% { opacity: .8; transform: scale(1) } 100% { opacity: 0; transform: scale(1.7) } }
    @keyframes celBurst {
      0% { opacity: 1; transform: translate(0, 0) rotate(0) scale(.6) }
      70% { opacity: 1 }
      100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1) }
    }
    @media (prefers-reduced-motion: reduce) {
      .cel, .cel-card, .cel-title, .cel-head, .cel-mail, .cel-rows, .cel .btn, .cel-ring .disc { animation: none; }
      .cel-ring::before, .cel-ring::after, .cel-confetti { display: none; }
      .cel-ring .tick { animation: none; stroke-dashoffset: 0; }
    }
  </style>
</head>

      var state = { lang: "uz", price: 25000, balance: null, affordable: false, botUsername: null, flow: null, error: "", notice: "" };
      var app = document.getElementById("app");

      function pickLang() {
        var code = String((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || "").slice(0, 2);
        return I18N[code] ? code : "uz";
      }
      state.lang = pickLang();

      function L(key) { var d = I18N[state.lang] || I18N.uz; return d[key] != null ? d[key] : I18N.uz[key]; }
      function errText(code) { var d = (I18N[state.lang] || I18N.uz).err; return d[code] || d.request_failed; }
      function money(v) {
        var n = Math.round(Number(v) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
        return n + (state.lang === "ru" ? " сум" : state.lang === "en" ? " UZS" : " so'm");
      }
      function fill(text, vars) {
        return String(text).replace(/\{(\w+)\}/g, function (m, k) { return vars && vars[k] != null ? vars[k] : m; });
      }
      function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
      function haptic(kind) {
        try {
          if (!tg || !tg.HapticFeedback) return;
          if (kind === "success" || kind === "error" || kind === "warning") tg.HapticFeedback.notificationOccurred(kind);
          else tg.HapticFeedback.impactOccurred(kind || "light");
        } catch (e) { /* eski mijozlar */ }
      }
      function setBusy(btn, on) { if (!btn) return; btn.disabled = on; btn.classList.toggle("busy", on); }
      function confirmBox(text) {
        return new Promise(function (resolve) {
          if (tg && tg.showConfirm) {
            try { tg.showConfirm(text, function (ok) { resolve(Boolean(ok)); }); return; } catch (e) { /* fallback */ }
          }
          resolve(window.confirm(text));
        });
      }
      function api(action, payload) {
        var body = Object.assign({ action: action, initData: tg ? tg.initData : "", launch: launchToken }, payload || {});
        return fetch(API_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
          .then(function (r) { return r.json().catch(function () { return { ok: false, error: "service_unavailable" }; }); })
          .catch(function () { return { ok: false, error: "network" }; });
      }

      // ---- oqim: { email, session (server imzolagan), stage, emailNew?, at }
      function saveFlow(flow) {
        state.flow = flow;
        try {
          if (flow && flow.email && flow.session) {
            flow.at = Date.now();
            localStorage.setItem(FLOW_KEY, JSON.stringify(flow));
          } else localStorage.removeItem(FLOW_KEY);
        } catch (e) { /* noop */ }
      }
      function loadFlow() {
        try {
          var raw = JSON.parse(localStorage.getItem(FLOW_KEY) || "null");
          if (raw && raw.email && raw.session && STAGES.indexOf(raw.stage) >= 0 && Date.now() - raw.at < FLOW_TTL_MS) return raw;
          localStorage.removeItem(FLOW_KEY);
        } catch (e) { /* noop */ }
        return null;
      }

      function shortfall() { return Math.max(0, Number(state.price) - Number(state.balance || 0)); }
      // Kabinetdagi "Xizmatlar" bo'limidan ochilgan (?from=cabinet) — orqaga kabinetga.
      var fromCabinet = (function () {
        try { return new URLSearchParams(location.search).get("from") === "cabinet"; } catch (e) { return false; }
      })();
      function openCabinet() {
        haptic("light");
        location.href = location.pathname + "?view=cabinet";
      }
      function openBot() {
        haptic("light");
        var link = state.botUsername ? "https://t.me/" + state.botUsername : null;
        if (tg && link) { try { tg.openTelegramLink(link); } catch (e) { /* noop */ } }
        if (tg) tg.close();
      }
      function openWallet() {
        haptic("light");
        location.href = location.pathname + "?view=cabinet&open=topup&need=" + shortfall();
      }
      function mailUrl(email) {
        var domain = String(email || "").split("@")[1] || "";
        return /gmail\.com$/i.test(domain) ? "https://mail.google.com/"
          : /(mail\.ru|inbox\.ru|bk\.ru|list\.ru)$/i.test(domain) ? "https://e.mail.ru/"
          : /(yandex\.|ya\.ru)/i.test(domain) ? "https://mail.yandex.com/"
          : /(outlook|hotmail|live)\./i.test(domain) ? "https://outlook.live.com/mail/"
          : /icloud\.com$/i.test(domain) ? "https://www.icloud.com/mail"
          : null;
      }
      function openMail(email) {
        haptic("light");
        var url = mailUrl(email);
        if (!url) return;
        if (tg && tg.openLink) { try { tg.openLink(url); return; } catch (e) { /* noop */ } }
        window.open(url, "_blank");
      }

      // ---- ko'rinishlar
      function header() {
        var low = state.balance !== null && !state.affordable;
        return '<div class="hero"><div class="hero-ic"><i class="bi bi-envelope-arrow-up-fill"></i></div><div>' +
          "<h1>" + esc(L("title")) + "</h1><p>" + esc(L("subtitle")) + "</p></div></div>" +
          '<div class="chips"><span class="chip"><i class="bi bi-tag"></i>' + esc(L("price")) + ": <b>" + esc(money(state.price)) + "</b></span>" +
          (state.balance !== null ? '<span class="chip ' + (low ? "low" : "ok") + '"><i class="bi bi-wallet2"></i>' + esc(L("balance")) + ": <b>" + esc(money(state.balance)) + "</b></span>" : "") +
          "</div>";
      }
      function stepper(active) {
        var names = [L("st1"), L("st2"), L("st3"), L("st4"), L("st5")];
        return '<div class="steps">' + names.map(function (n, i) {
          var cls = i + 1 < active ? "done" : i + 1 === active ? "active" : "";
          return '<div class="step ' + cls + '"><div class="bar"><i></i></div>' + (i + 1 < active ? '<i class="bi bi-check2"></i> ' : "") + esc(n) + "</div>";
        }).join("") + "</div>";
      }
      function notices() {
        var html = "";
        if (state.notice) html += '<div class="notice info fade-in"><i class="bi bi-info-circle-fill"></i><div>' + esc(state.notice) + "</div></div>";
        if (state.error) html += '<div class="notice err fade-in"><i class="bi bi-exclamation-octagon-fill"></i><div>' + esc(state.error) + "</div></div>";
        return html;
      }
      function stateView(kind, iconName, title, text, actions) {
        app.innerHTML = header() + '<div class="state fade-in"><div class="big ' + kind + '"><i class="bi bi-' + iconName + '"></i></div><h2>' +
          esc(title) + "</h2><p>" + esc(text) + "</p>" +
          actions.map(function (a, i) { return '<button class="btn ' + (a.cls || "") + '" data-act="' + i + '">' + (a.icon ? '<i class="bi bi-' + a.icon + '"></i>' : "") + esc(a.label) + "</button>"; }).join("") +
          "</div>";
        actions.forEach(function (a, i) { app.querySelector('[data-act="' + i + '"]').addEventListener("click", function (e) { a.onClick(e.currentTarget); }); });
        syncBack();
      }
      function lowView() {
        return stateView("warn", "wallet2", L("low_title"), fill(L("low_text"), { price: money(state.price), balance: money(state.balance || 0), need: money(shortfall()) }), [
          { label: L("topup"), cls: "primary", icon: "plus-circle", onClick: openWallet },
          { label: L("back_bot"), cls: "ghost", onClick: openBot }
        ]);
      }

      function render() {
        var flow = state.flow;
        if (!flow) return renderEmail();
        if (flow.stage === "new") return renderNewEmail();
        return renderCode(flow.stage);
      }

      function emailInputHtml(id, label, value) {
        return '<label class="lbl" for="' + id + '">' + esc(label) + "</label>" +
          '<div class="field"><input id="' + id + '" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" maxlength="254" placeholder="name@gmail.com" value="' + esc(value || "") + '"></div>';
      }

      // Xato javobini umumiy qayta ishlash. true — ko'rinish o'zgardi.
      function handleError(r, btn, isFinal) {
        setBusy(btn, false);
        haptic("error");
        if (r.error === "insufficient_funds") {
          if (Number.isFinite(Number(r.balance))) state.balance = Number(r.balance);
          state.affordable = false;
          saveFlow(null);
          lowView();
          return;
        }
        if (isFinal && ["result_unknown", "network", "service_unavailable", "timeout", "charge_refund_failed"].indexOf(r.error) >= 0) {
          saveFlow(null);
          stateView("warn", "question-circle", L("unknown_title"), L("unknown_text"), [{ label: L("back_bot"), cls: "primary", onClick: openBot }]);
          return;
        }
        if (r.error === "session_expired" || r.error === "account_banned") {
          saveFlow(null);
          state.notice = "";
          state.error = r.error === "session_expired" ? L("expired") : errText(r.error);
          render();
          return;
        }
        state.error = errText(r.error) + (Number.isInteger(r.remaining) ? " " + fill(L("remaining"), { n: r.remaining }) : "");
        render();
      }

      function renderEmail() {
        if (!state.affordable) return lowView();
        app.innerHTML = header() + stepper(1) + notices() +
          '<div class="card fade-in"><h2><i class="bi bi-person-badge"></i>' + esc(L("s1_title")) + "</h2><p>" + esc(L("s1_text")) + "</p>" +
          emailInputHtml("ceEmail", L("email"), "") +
          '<button class="btn primary" id="ceSend" disabled><i class="bi bi-envelope-arrow-up"></i>' + esc(L("send")) + "</button>" +
          '<p class="muted" style="margin-top:10px;font-size:12px;text-align:center">' + esc(fill(L("charged_note"), { price: money(state.price) })) + "</p>" +
          "</div>";
        var email = document.getElementById("ceEmail");
        var send = document.getElementById("ceSend");
        function check() { send.disabled = !EMAIL_RE.test(email.value.trim()); }
        email.addEventListener("input", check);
        email.addEventListener("keydown", function (e) { if (e.key === "Enter" && !send.disabled) send.click(); });
        setTimeout(function () { try { email.focus(); } catch (e) { /* noop */ } }, 50);
        send.addEventListener("click", function () {
          var mail = email.value.trim();
          state.error = ""; state.notice = "";
          setBusy(send, true);
          haptic("light");
          api("change_email", { step: "start", email: mail }).then(function (r) {
            if (!r.ok) return handleError(r, send, false);
            haptic("success");
            saveFlow({ email: mail, session: r.session, stage: "login" });
            render();
          });
        });
        syncBack();
      }

      function renderCode(stage) {
        var flow = state.flow;
        var cfg = {
          login: { n: 2, title: "s2_title", text: "s2_text", step: "login", next: "old", mail: flow.email, icon: "box-arrow-in-right" },
          old: { n: 3, title: "s3_title", text: "s3_text", step: "verify_code_old", next: "new", mail: flow.email, icon: "envelope-open" },
          confirm: { n: 5, title: "s5_title", text: "s5_text", step: "confirm", next: null, mail: flow.emailNew, icon: "shield-check" }
        }[stage];
        var isFinal = stage === "confirm";
        app.innerHTML = header() + stepper(cfg.n) + notices() +
          '<div class="card fade-in"><h2><i class="bi bi-' + cfg.icon + '"></i>' + esc(L(cfg.title)) + "</h2><p>" + esc(L(cfg.text)) + "</p>" +
          '<span class="email-pill"><i class="bi bi-envelope"></i>' + esc(cfg.mail) + "</span>" +
          '<label class="lbl" for="ceCode">' + esc(L("code")) + "</label>" +
          '<div class="field"><input id="ceCode" class="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="••••••"></div>' +
          '<button class="btn ' + (isFinal ? "green" : "primary") + '" id="ceVerify" disabled><i class="bi bi-' + (isFinal ? "check2-all" : "check2-circle") + '"></i>' +
          esc(isFinal ? fill(L("finish"), { price: money(state.price) }) : L("verify")) + "</button>" +
          (mailUrl(cfg.mail) ? '<button class="btn" id="ceMail"><i class="bi bi-envelope-paper"></i>' + esc(L("open_mail")) + "</button>" : "") +
          '<button class="btn ghost" id="ceCancel"><i class="bi bi-x-circle"></i>' + esc(L("cancel")) + "</button>" +
          "</div>";
        var code = document.getElementById("ceCode");
        var verify = document.getElementById("ceVerify");
        function check() {
          code.value = code.value.replace(/\D/g, "").slice(0, 8);
          verify.disabled = !/^\d{4,8}$/.test(code.value);
        }
        code.addEventListener("input", check);
        code.addEventListener("keydown", function (e) { if (e.key === "Enter" && !verify.disabled) verify.click(); });
        var mailBtn = document.getElementById("ceMail");
        if (mailBtn) mailBtn.addEventListener("click", function () { openMail(cfg.mail); });
        document.getElementById("ceCancel").addEventListener("click", function () { cancelFlow(this); });
        setTimeout(function () { try { code.focus(); } catch (e) { /* noop */ } }, 50);

        verify.addEventListener("click", function () {
          var go = isFinal ? confirmBox(fill(L("confirm_pay"), { price: money(state.price), email: flow.emailNew })) : Promise.resolve(true);
          go.then(function (ok) {
            if (!ok) return;
            state.error = ""; state.notice = "";
            setBusy(verify, true);
            haptic("light");
            api("change_email", { step: cfg.step, session: flow.session, code: code.value, email: flow.email, emailNew: flow.emailNew || "" }).then(function (r) {
              if (!r.ok) return handleError(r, verify, isFinal);
              haptic("success");
              if (!isFinal) {
                saveFlow(Object.assign({}, flow, { stage: cfg.next }));
                return render();
              }
              var newEmail = r.newEmail || flow.emailNew;
              saveFlow(null);
              if (Number.isFinite(Number(r.balance))) state.balance = Number(r.balance);
              stateView("ok", "patch-check-fill", L("ok_title"), fill(L("ok_text"), { email: newEmail, cost: money(r.chargedAmount || state.price) }), [
                { label: L("back_bot"), cls: "primary", icon: "chat-dots", onClick: openBot }
              ]);
              celebrate(Number(r.chargedAmount) || state.price, state.balance, newEmail);
            });
          });
        });
        syncBack();
      }

      function renderNewEmail() {
        var flow = state.flow;
        app.innerHTML = header() + stepper(4) + notices() +
          '<div class="card fade-in"><h2><i class="bi bi-envelope-plus"></i>' + esc(L("s4_title")) + "</h2><p>" + esc(L("s4_text")) + "</p>" +
          '<span class="email-pill"><i class="bi bi-envelope"></i>' + esc(flow.email) + ' <i class="bi bi-arrow-right"></i> …</span>' +
          emailInputHtml("ceNew", L("new_email"), flow.emailNew || "") +
          '<button class="btn primary" id="ceSendNew" disabled><i class="bi bi-envelope-arrow-up"></i>' + esc(L("send_new")) + "</button>" +
          '<button class="btn ghost" id="ceCancel"><i class="bi bi-x-circle"></i>' + esc(L("cancel")) + "</button>" +
          "</div>";
        var input = document.getElementById("ceNew");
        var send = document.getElementById("ceSendNew");
        function check() {
          var v = input.value.trim();
          send.disabled = !EMAIL_RE.test(v) || v.toLowerCase() === flow.email.toLowerCase();
        }
        check();
        input.addEventListener("input", check);
        input.addEventListener("keydown", function (e) { if (e.key === "Enter" && !send.disabled) send.click(); });
        document.getElementById("ceCancel").addEventListener("click", function () { cancelFlow(this); });
        setTimeout(function () { try { input.focus(); } catch (e) { /* noop */ } }, 50);
        send.addEventListener("click", function () {
          var mail = input.value.trim();
          if (mail.toLowerCase() === flow.email.toLowerCase()) { state.error = L("same_email"); return render(); }
          state.error = ""; state.notice = "";
          setBusy(send, true);
          haptic("light");
          api("change_email", { step: "set_new_email", session: flow.session, emailNew: mail, email: flow.email }).then(function (r) {
            if (!r.ok) {
              flow.emailNew = mail;
              return handleError(r, send, false);
            }
            haptic("success");
            saveFlow(Object.assign({}, flow, { emailNew: mail, stage: "confirm" }));
            render();
          });
        });
        syncBack();
      }

      // ---- muvaffaqiyat animatsiyasi (device logout bilan bir xil)
      function celebrate(cost, balance, email) {
        var old = document.querySelector(".cel");
        if (old) old.remove();
        var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var colors = ["#34d399", "#10b981", "#fde68a", "#f59e0b", "#8b5cf6", "#ec4899", "#60a5fa", "#ffffff"];
        var pieces = "";
        for (var i = 0; i < (reduce ? 0 : 46); i++) {
          var angle = Math.random() * Math.PI * 2;
          var dist = 120 + Math.random() * 190;
          pieces += '<i class="' + (i % 3 === 0 ? "dot" : "") + '" style="background:' + colors[i % colors.length] +
            ";--x:" + Math.round(Math.cos(angle) * dist) + "px;--y:" + Math.round(Math.sin(angle) * dist * 0.85 + 140) + "px" +
            ";--r:" + Math.round(Math.random() * 720 - 360) + "deg;--d:" + (0.45 + Math.random() * 0.25).toFixed(2) + "s" +
            ";--t:" + (1.3 + Math.random() * 0.9).toFixed(2) + 's"></i>';
        }
        var el = document.createElement("div");
        el.className = "cel";
        el.setAttribute("role", "dialog");
        el.setAttribute("aria-live", "assertive");
        el.innerHTML = '<div class="cel-confetti">' + pieces + "</div>" +
          '<div class="cel-card">' +
          '<div class="cel-ring"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="celGrad" x1="0" y1="0" x2="1" y2="1">' +
          '<stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></linearGradient></defs>' +
          '<circle class="disc" cx="50" cy="50" r="46"/><path class="tick" d="M30 52 L44 65 L71 37"/></svg></div>' +
          '<div class="cel-title">' + esc(L("cel_title")) + "</div>" +
          '<div class="cel-head">' + esc(L("cel_head")) + "</div>" +
          (email ? '<div class="cel-mail"><i class="bi bi-envelope-check"></i>' + esc(email) + "</div>" : "") +
          '<div class="cel-rows"><span class="cel-pill"><i class="bi bi-credit-card"></i>' + esc(L("cel_charged")) + " <b>" + esc(money(cost)) + "</b></span>" +
          (balance !== null && balance !== undefined && isFinite(Number(balance))
            ? '<span class="cel-pill"><i class="bi bi-wallet2"></i>' + esc(L("cel_balance")) + " <b>" + esc(money(balance)) + "</b></span>" : "") +
          "</div>" +
          '<button class="btn green" data-cel-close><i class="bi bi-check2-circle"></i>' + esc(L("cel_ok")) + "</button></div>";
        document.body.appendChild(el);
        var close = function () {
          if (el.classList.contains("closing")) return;
          haptic("light");
          el.classList.add("closing");
          setTimeout(function () { el.remove(); }, 200);
        };
        el.querySelector("[data-cel-close]").addEventListener("click", close);
        el.addEventListener("click", function (event) { if (event.target === el) close(); });
      }

      function cancelFlow(btn) {
        var flow = state.flow;
        if (!flow) return render();
        confirmBox(L("confirm_cancel")).then(function (ok) {
          if (!ok) return;
          setBusy(btn, true);
          api("change_email", { step: "cancel", session: flow.session }).then(function () {
            // Bekor qilish bepul — provayder xato bersa ham lokal oqimni tozalaymiz.
            saveFlow(null);
            state.error = "";
            state.notice = L("cancelled");
            haptic("success");
            render();
          });
        });
      }

      function onBack() {
        if (state.flow) return cancelFlow(document.getElementById("ceCancel"));
        if (fromCabinet) return openCabinet();
        if (tg) tg.close();
      }
      function syncBack() {
        if (!tg || !tg.BackButton) return;
        try { state.flow || fromCabinet ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) { /* noop */ }
      }
      if (tg && tg.BackButton) { try { tg.BackButton.onClick(onBack); } catch (e) { /* noop */ } }

      function boot() {
        if (!tg || (!tg.initData && !launchToken)) {
          return stateView("err", "phone", L("auth_title"), L("auth_text"), []);
        }
        api("ce_bootstrap").then(function (r) {
          if (!r.ok) {
            if (r.error === "unauthorized" || r.error === "launch_expired") {
              return stateView("err", "shield-exclamation", L("auth_title"), L("auth_text"), []);
            }
            return stateView("err", "wifi-off", L("title"), L("load_error"), [{ label: L("retry"), cls: "primary", icon: "arrow-clockwise", onClick: boot }]);
          }
          if (I18N[r.lang]) state.lang = r.lang;
          document.documentElement.lang = state.lang;
          document.title = L("title");
          state.price = Number(r.price) || state.price;
          state.balance = r.balance;
          state.affordable = Boolean(r.affordable);
          state.botUsername = r.botUsername;
          if (!r.enabled) {
            var back = fromCabinet ? { label: L("back_cabinet"), cls: "primary", icon: "arrow-left", onClick: openCabinet } : { label: L("back_bot"), cls: "primary", onClick: openBot };
            return r.paused
              ? stateView("warn", "pause-circle", L("paused_title"), L("paused_text"), [back])
              : stateView("warn", "hourglass-split", L("off_title"), L("off_text"), [back]);
          }
          var resumed = loadFlow();
          if (resumed) {
            state.flow = resumed;
            state.notice = fill(L("resumed"), { email: resumed.email });
          }
          render();
        });
      }

      boot();
    })();
  </script>
</body>
</html>
