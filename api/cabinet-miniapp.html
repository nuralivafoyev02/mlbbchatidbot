      // ---------------------------------------------------------------- utils
      function L(key, params) {
        var text = (I18N[state.lang] || I18N.uz)[key] || I18N.uz[key] || key;
        Object.keys(params || {}).forEach(function (k) { text = text.split("{" + k + "}").join(params[k]); });
        return text;
      }
      function icon(name) { return '<i class="bi bi-' + name + '" aria-hidden="true"></i>'; }
      function esc(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }
      function som(value) {
        var n = Math.round(Number(value) || 0);
        return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " " + L("som");
      }
      function num(value) {
        return String(Math.round(Number(value) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
      }
      function acc(a) { return a.account_id + " (" + a.zone_id + ")"; }
      function fmtDate(iso) {
        var d = new Date(iso);
        if (!iso || isNaN(d.getTime())) return "—";
        var p = function (n) { return String(n).padStart(2, "0"); };
        return p(d.getDate()) + "." + p(d.getMonth() + 1) + "." + d.getFullYear() + " " + p(d.getHours()) + ":" + p(d.getMinutes());
      }

      var AGO = {
        uz: { now: "hozirgina", suffix: " oldin", units: ["yil", "oy", "kun", "soat", "daq"] },
        ru: { now: "только что", suffix: " назад", units: ["г.", "мес.", "дн.", "ч", "мин"] },
        en: { now: "just now", suffix: " ago", units: ["y", "mo", "d", "h", "min"] }
      };
      function timeAgo(iso) {
        var seconds = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
        if (!isFinite(seconds)) return "";
        var w = AGO[state.lang] || AGO.uz;
        var steps = [31536000, 2592000, 86400, 3600, 60];
        for (var i = 0; i < steps.length; i++) {
          if (seconds >= steps[i]) return Math.floor(seconds / steps[i]) + " " + w.units[i] + w.suffix;
        }
        return w.now;
      }

      function haptic(kind) {
        try {
          if (!tg || !tg.HapticFeedback) return;
          if (kind === "select") tg.HapticFeedback.selectionChanged();
          else if (kind === "success" || kind === "error" || kind === "warning") tg.HapticFeedback.notificationOccurred(kind);
          else tg.HapticFeedback.impactOccurred(kind || "light");
        } catch (e) { /* eski mijozlar */ }
      }

      // Tugma ichida spinner (amal tugaguncha qayta bosilmaydi).
      function setBusy(el, on) {
        if (!el) return;
        el.classList.toggle("busy", Boolean(on));
        el.setAttribute("aria-busy", on ? "true" : "false");
        el.disabled = Boolean(on);
      }

      var toastTimer = null;
      function toast(text) {
        var el = document.getElementById("toast");
        el.textContent = text;
        el.classList.remove("hidden");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { el.classList.add("hidden"); }, 2400);
      }

      function api(action, payload) {
        var body = Object.assign({ action: action, initData: tg ? tg.initData : "", lang: state.lang }, payload || {});
        return fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        }).then(function (r) {
          return r.json().catch(function () { return { ok: false, error: "bad_response" }; });
        }).catch(function () { return { ok: false, error: "network" }; });
      }

      function confirmAction(text) {
        return new Promise(function (resolve) {
          if (tg && tg.showConfirm) {
            try { tg.showConfirm(text, function (ok) { resolve(Boolean(ok)); }); return; } catch (e) { /* fallback */ }
          }
          resolve(window.confirm(text));
        });
      }

      function errText(code, extra) {
        var key = "err_" + code;
        return (I18N[state.lang] || I18N.uz)[key] ? L(key, extra) : L("error_text");
      }

      function contactAdmin() {
        var u = state.data && state.data.supportUsername;
        if (!u) return;
        var link = "https://t.me/" + u;
        if (tg && tg.openTelegramLink) { try { tg.openTelegramLink(link); return; } catch (e) { /* fallback */ } }
        window.open(link, "_blank");
      }

      // ---------------------------------------------------------------- sheet
      // Oyna: pastdan chiqadi, yopilganda pastga tushib so'nadi; ikkalasida ham
      // yengil vibratsiya. Ochiq oyna ustidan yangisi ochilsa — kontent joyida
      // almashadi (oyna qayta sakramaydi).
      var sheetSeq = 0;
      function openSheet(html) {
        var root = document.getElementById("sheetRoot");
        var current = root.querySelector(".sheet:not(.closing) .sheet-inner");
        sheetSeq += 1;
        haptic("light");
        if (current) {
          stopCountdown();
          stopTopupTimers();
          setSheet(current, html);
          return current;
        }
        root.innerHTML = '<div class="sheet-backdrop"></div><div class="sheet"><div class="sheet-inner"><div class="sheet-handle"></div>' +
          '<div class="sheet-body">' + html + "</div></div></div>";
        root.querySelector(".sheet-backdrop").addEventListener("click", closeSheet);
        syncBackButton();
        return root.querySelector(".sheet-inner");
      }
      function closeSheet() {
        var root = document.getElementById("sheetRoot");
        stopCountdown();
        stopTopupTimers();
        var sheet = root.querySelector(".sheet");
        if (!sheet || sheet.classList.contains("closing")) { syncBackButton(); return; }
        haptic("light");
        var seq = ++sheetSeq;
        sheet.classList.add("closing");
        var backdrop = root.querySelector(".sheet-backdrop");
        if (backdrop) backdrop.classList.add("closing");
        setTimeout(function () {
          if (seq === sheetSeq) { root.innerHTML = ""; syncBackButton(); }
        }, 240);
      }
      function setSheet(sheet, html) {
        sheet.innerHTML = '<div class="sheet-handle"></div><div class="sheet-body">' + html + "</div>";
      }

      // ---------------------------------------------------------------- nav
      function moveNavIndicator(nav, animate) {
        var indicator = nav.querySelector(".nav-indicator");
        var active = nav.querySelector("button.active");
        if (!indicator || !active || !active.offsetWidth) return;
        if (!animate) indicator.classList.remove("ready");
        indicator.style.width = active.offsetWidth + "px";
        indicator.style.transform = "translate3d(" + active.offsetLeft + "px, 0, 0)";
        if (!animate) { void indicator.offsetWidth; indicator.classList.add("ready"); }
      }

      function currentTab() { return state.tabs[state.mode]; }

      function renderNav() {
        var dock = document.getElementById("dock");
        var nav = document.getElementById("nav");
        var tabs = MODES[state.mode];
        var key = state.lang + ":" + state.mode;
        var fresh = nav.dataset.key !== key;
        if (fresh) {
          nav.innerHTML = '<div class="nav-indicator" aria-hidden="true"></div>' + tabs.map(function (t) {
            return '<button data-tab="' + t.id + '"><span class="nav-ico"></span><span>' + esc(L(t.label)) + "</span></button>";
          }).join("");
          nav.dataset.key = key;
          nav.style.setProperty("--tabs", String(tabs.length));
          Array.prototype.forEach.call(nav.querySelectorAll("button"), function (b) {
            b.addEventListener("click", function () { goToTab(b.dataset.tab); });
          });

          var side = document.getElementById("dockSide");
          var toShop = state.mode === "main";
          side.className = "dock-side " + (toShop ? "to-shop" : "to-home");
          side.innerHTML = icon(toShop ? "bag-heart-fill" : "house-fill") + "<span>" + esc(L(toShop ? "tab_shop" : "tab_home")) + "</span>";
          side.setAttribute("aria-label", L(toShop ? "tab_shop" : "tab_home"));
          dock.classList.toggle("shop", !toShop);
        }
        tabs.forEach(function (t) {
          var b = nav.querySelector('button[data-tab="' + t.id + '"]');
          b.classList.toggle("active", currentTab() === t.id);
          b.querySelector(".nav-ico").innerHTML = icon(currentTab() === t.id ? t.active : t.ico);
        });
        dock.classList.remove("hidden");
        moveNavIndicator(nav, !fresh);
      }

      function goToTab(id) {
        if (currentTab() === id) return;
        var ids = MODES[state.mode].map(function (t) { return t.id; });
        var from = ids.indexOf(currentTab());
        haptic("select");
        state.tabs[state.mode] = id;
        renderNav();
        render();
        window.scrollTo(0, 0);
        animateApp(ids.indexOf(id) > from ? "slide-from-right" : "slide-from-left");
      }

      function animateApp(cls) {
        app.classList.remove("slide-from-right", "slide-from-left", "pop-in");
        void app.offsetWidth;
        app.classList.add(cls);
      }

      // Asosiy ⇄ Do'kon: tugma joyidan butun ekranga yoyiladigan doira, keyin
      // kontent almashadi va parda so'nadi.
      var warping = false;
      function switchMode(mode) {
        if (warping || state.mode === mode) return;
        haptic("medium");
        var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var apply = function () {
          state.mode = mode;
          closeSheet();
          renderNav();
          render();
          window.scrollTo(0, 0);
          syncBackButton();
        };
        if (reduce) { apply(); return; }

        warping = true;
        var warp = document.getElementById("warp");
        var rect = document.getElementById("dockSide").getBoundingClientRect();
        warp.style.setProperty("--wx", Math.round(rect.left + rect.width / 2) + "px");
        warp.style.setProperty("--wy", Math.round(rect.top + rect.height / 2) + "px");
        var toShop = mode === "shop";
        warp.className = "warp " + (toShop ? "shop" : "home");
        warp.innerHTML = '<div><div class="warp-ico">' + icon(toShop ? "bag-heart-fill" : "house-fill") + '</div><div class="warp-label">' +
          esc(L(toShop ? "shop_title" : "title")) + "</div></div>";
        void warp.offsetWidth;
        warp.classList.add("in");

        setTimeout(function () {
          apply();
          animateApp("pop-in");
          warp.classList.remove("in");
          warp.classList.add("out");
          setTimeout(function () {
            warp.className = "warp hidden";
            warp.innerHTML = "";
            warping = false;
          }, 400);
        }, 560);
      }

      // Telegram "Orqaga": avval oyna (sheet), keyin do'kondan asosiyga.
      function syncBackButton() {
        if (!tg || !tg.BackButton) return;
        var open = Boolean(document.querySelector("#sheetRoot .sheet:not(.closing)")) || state.mode === "shop";
        if (open) tg.BackButton.show(); else tg.BackButton.hide();
      }

      function onBack() {
        var cel = document.querySelector(".cel:not(.closing) [data-cel-close]");
        if (cel) { cel.click(); return; }
        if (document.querySelector("#sheetRoot .sheet:not(.closing)")) { closeSheet(); return; }
        if (state.mode === "shop") switchMode("main");
      }

      // ---------------------------------------------------------------- render
      function renderHeader() {
        var head = document.getElementById("head");
        head.innerHTML = headerHtml();
        document.getElementById("balBtn").addEventListener("click", openWalletSheet);
      }

      function headerHtml() {
        var u = state.data.user;
        var name = [u.first_name, u.last_name].filter(Boolean).join(" ") || u.username || u.id;
        var avatar = /^https:\/\//.test(u.photo_url || "")
          ? '<img class="avatar" src="' + esc(u.photo_url) + '" alt="">'
          : '<div class="avatar">' + esc(String(name).trim().charAt(0).toUpperCase() || "?") + "</div>";
        return '<div class="head">' + avatar +
          '<div class="grow"><div class="head-name ellipsis">' + esc(name) + "</div>" +
          '<div class="head-sub ellipsis">' + (u.username ? "@" + esc(u.username) + " · " : "") + "ID <code>" + esc(u.id) + "</code></div></div>" +
          balanceBtnHtml() + "</div>";
      }

      function limitCard(kind) {
        var d = state.data;
        var lim = d.limits[kind] || {};
        var value, small = "", bar = "", empty = false;
        if (d.unlimited) {
          value = "∞";
        } else if (typeof lim.remaining !== "number") {
          value = "—";
        } else {
          value = String(lim.remaining);
          empty = lim.remaining <= 0;
        }
        return '<div class="limit ' + KINDS[kind].cls + (empty ? " zero" : "") + '"><div class="limit-ico">' + icon(KINDS[kind].icon) + "</div>" +
          '<div class="limit-value">' + esc(value) + small + '</div><div class="limit-label">' + esc(L("lim_" + kind)) + "</div>" + bar + "</div>";
      }

      function historyItemHtml(h) {
        var kind = KINDS[h.kind] || KINDS.full_info;
        var target = h.account_id ? h.account_id + (h.zone_id ? " (" + h.zone_id + ")" : "") : (h.target || "");
        var sub = [];
        if (h.source === "admin") sub.push('<span class="pill accent">' + esc(L("src_admin")) + "</span>");
        if (h.source === "purchase") sub.push('<span class="pill green">' + esc(L("src_purchase")) + "</span>");
        sub.push(esc(timeAgo(h.created_at)));
        if (typeof h.remaining === "number") sub.push(esc(L("left_n", { n: h.remaining })));
        var plus = h.delta > 0;
        return '<div class="item"><div class="item-ico ' + (plus ? "green" : kind.tone) + '">' + icon(plus ? "plus-lg" : kind.icon) + "</div>" +
          '<div class="grow"><div class="item-title ellipsis">' + esc(L("lim_" + h.kind).replace(/ ·.*$/, "")) + (target ? ' <span class="muted" style="font-weight:500">· ' + esc(target) + "</span>" : "") + "</div>" +
          '<div class="item-sub">' + sub.join(" · ") + "</div></div>" +
          '<div class="item-right"><div class="delta ' + (plus ? "plus" : "minus") + '">' + (plus ? "+" : "") + esc(h.delta) + "</div></div></div>";
      }

      function viewerItemHtml(v) {
        var who = v.checker_username ? "@" + v.checker_username : (v.checker_name || L("someone"));
        var ico = { full_info: ["file-earmark-text", ""], bind_info: ["link-45deg", "green"] }[v.action] || ["search", "gold"];
        return '<div class="item"><div class="item-ico ' + ico[1] + '">' + icon(ico[0]) + "</div>" +
          '<div class="grow"><div class="item-title ellipsis">' + esc(who) + "</div>" +
          '<div class="item-sub">' + esc(L("act_" + v.action) || v.action) + " · " + esc(v.account_id) + " (" + esc(v.zone_id) + ")</div></div>" +
          '<div class="item-right item-sub">' + esc(timeAgo(v.created_at)) + "</div></div>";
      }

      function renderHome() {
        var d = state.data;
        var used = d.history.filter(function (h) { return h.delta < 0 && h.source === "use"; }).length;
        var html = '<div class="section-title">' + esc(L("limits")) + "</div>" +
          '<div class="limits">' + limitCard("full_info") + limitCard("reset_pw") + "</div>" +
          '<div class="stats">' +
          '<div class="stat"><b>' + d.accounts.length + "<small class=\"muted\" style=\"font-size:12px\">/" + d.accountMax + "</small></b><span>" + esc(L("st_accounts")) + "</span></div>" +
          '<div class="stat"><b>' + d.viewers.length + "</b><span>" + esc(L("st_viewers")) + "</span></div>" +
          '<div class="stat"><b>' + used + "</b><span>" + esc(L("st_used")) + "</span></div></div>" +
          '<button class="cta" id="ctaBuy"><div class="ico">' + icon("lightning-charge-fill") + '</div><div class="grow"><b>' + esc(L("buy_more")) +
          "</b><span>" + esc(L("buy_more_sub")) + "</span></div>" + icon("chevron-right") + "</button>";

        var recent = d.history.slice(0, 3);
        if (recent.length) {
          html += '<div class="section-title">' + esc(L("recent")) + '<button class="link" data-goto="history">' + esc(L("see_all")) + "</button></div>" +
            recent.map(historyItemHtml).join("");
        }
        app.innerHTML = html;
        document.getElementById("ctaBuy").addEventListener("click", openShopLimits);
        var more = app.querySelector("[data-goto]");
        if (more) more.addEventListener("click", function () { goToTab("history"); });
      }

      function renderAccounts() {
        var d = state.data;
        var html = '<div class="section-title" style="margin-top:4px">' + esc(L("accounts_title")) + " · " + d.accounts.length + "/" + d.accountMax + "</div>";
        if (!d.accounts.length) {
          html += '<div class="empty">' + icon("person-plus") + esc(L("no_accounts")).replace(/\n/g, "<br>") + "</div>";
        }
        html += d.accounts.map(function (a) {
          var badge = a.ml_linked
            ? '<span class="pill green">' + icon("check2") + " " + esc(L("ml_linked")) + "</span>"
            : '<span class="pill">' + esc(L("ml_not_linked")) + "</span>";
          var main = a.ml_linked
            ? '<button class="btn primary" data-ml-open="' + esc(a.id) + '">' + icon("controller") + esc(L("ml_open")) + "</button>"
            : '<button class="btn primary" data-ml-link="' + esc(a.id) + '">' + icon("link-45deg") + esc(L("ml_link")) + "</button>";
          return '<div class="acc' + (a.ml_linked ? " linked" : "") + '"><div class="row"><div class="item-ico">' + icon("controller") + "</div>" +
            '<div class="grow"><div class="item-title ellipsis">' + esc(a.ml_nickname || acc(a)) + "</div>" +
            '<div class="item-sub">' + (a.ml_nickname ? esc(acc(a)) + " · " : "") + badge + "</div></div></div>" +
            '<div class="acc-actions">' + main + '<button class="btn danger" style="flex:0 0 auto;width:auto;padding:10px 14px" data-remove="' + esc(a.id) + '" aria-label="' + esc(L("remove")) + '">' + icon("trash3") + "</button></div></div>";
        }).join("");
        if (d.accounts.length < d.accountMax) {
          html += '<button class="btn" id="addAccBtn" style="margin-top:4px">' + icon("plus-lg") + esc(L("add_account")) + "</button>";
        }
        app.innerHTML = html;

        var addBtn = document.getElementById("addAccBtn");
        if (addBtn) addBtn.addEventListener("click", openAddAccount);
        bindAll("[data-ml-open]", function (el) { openMlAccount(el.dataset.mlOpen); });
        bindAll("[data-ml-link]", function (el) { openLink(el.dataset.mlLink); });
        bindAll("[data-remove]", function (el) { removeAccount(el.dataset.remove, el); });
      }

      function renderHistory() {
        var d = state.data;
        var html = '<div class="seg" style="margin-top:4px">' +
          '<button data-hist="limits" class="' + (state.histTab === "limits" ? "active" : "") + '">' + esc(L("hist_limits")) + "</button>" +
          '<button data-hist="viewers" class="' + (state.histTab === "viewers" ? "active" : "") + '">' + esc(L("hist_viewers")) + " · " + d.viewers.length + "</button></div>";
        if (state.histTab === "limits") {
          html += d.history.length
            ? d.history.map(historyItemHtml).join("")
            : '<div class="empty">' + icon("hourglass") + esc(L(d.historyAvailable ? "no_history" : "no_history_setup")) + "</div>";
        } else {
          html += d.viewers.length
            ? d.viewers.map(viewerItemHtml).join("")
            : '<div class="empty">' + icon("eye-slash") + esc(L("no_viewers")) + "</div>";
        }
        app.innerHTML = html;
        bindAll("[data-hist]", function (el) {
          if (state.histTab === el.dataset.hist) return;
          haptic("select");
          state.histTab = el.dataset.hist;
          renderHistory();
        });
      }

      // Do'kon: pochtalar 30 tadan — ro'yxat oxiri ko'ringanda keyingisi yuklanadi.
      var fmObserver = null;

      function fmItemHtml(fm) {
        return '<button class="item" data-fm="' + esc(fm.id) + '"><div class="item-ico pink">' + icon("envelope-at") + "</div>" +
          '<div class="grow"><div class="item-title ellipsis">' + esc(fm.email) + "</div>" +
          (fm.note ? '<div class="item-sub ellipsis">' + esc(fm.note) + "</div>" : "") + "</div>" +
          '<div class="item-right"><div class="price-sum">' + esc(fm.price ? som(fm.price) : (fm.price_text || L("price_agreed"))) + "</div></div></button>";
      }

      function bindFmItems(root) {
        Array.prototype.forEach.call(root.querySelectorAll("[data-fm]:not([data-bound])"), function (el) {
          el.setAttribute("data-bound", "1");
          el.addEventListener("click", function () { buyFirstmail(el.dataset.fm); });
        });
      }

      function renderShop() {
        var d = state.data;
        var html = '<div class="section-title" style="margin-top:4px">' + esc(L("shop_fm")) + " · " + esc(d.firstmailTotal || d.firstmails.length) + "</div>" +
          '<div class="item-sub" style="margin:-4px 2px 12px">' + esc(L("shop_fm_lead")) + "</div>";
        html += d.firstmails.length
          ? '<div id="fmList">' + d.firstmails.map(fmItemHtml).join("") + "</div>" +
            '<div class="fm-more' + (d.firstmailHasMore ? "" : " hidden") + '" id="fmMore"><div class="spinner"></div></div>'
          : '<div class="empty">' + icon("inbox") + esc(L("no_fm")) + "</div>";
        app.innerHTML = html;
        bindFmItems(app);

        var more = document.getElementById("fmMore");
        if (more && d.firstmailHasMore && "IntersectionObserver" in window) {
          fmObserver = new IntersectionObserver(function (entries) {
            if (entries[0].isIntersecting) loadMoreFirstmails();
          }, { rootMargin: "300px 0px" });
          fmObserver.observe(more);
        }
      }

      function renderDonat() {
        app.innerHTML = '<div class="soon"><div class="big">' + icon("gem") + "</div><h2>" + esc(L("soon")) + "</h2><p>" + esc(L("soon_text")) + "</p></div>";
      }

      var ORDER_KINDS = {
        firstmail: { icon: "envelope-at", tone: "pink" },
        limit: { icon: "lightning-charge", tone: "" },
        donat: { icon: "gem", tone: "gold" }
      };
      var ORDER_STATUS = { pending: "gold", done: "green", cancelled: "red", refunded: "accent" };

      function orderTitle(o) {
        // Limit paketi: "full_info:10" → "To'liq ma'lumot × 10 ta"
        var m = o.kind === "limit" && /^(full_info|reset_pw):(\d+)$/.exec(o.title || "");
        if (m) return L("lim_" + m[1]) + " × " + m[2] + " " + L("pcs");
        return o.title || L("ord_" + o.kind);
      }

      function orderPrice(o) {
        return o.price ? som(o.price) : (o.price_text || L("price_agreed"));
      }

      function orderItemHtml(o) {
        var k = ORDER_KINDS[o.kind] || ORDER_KINDS.limit;
        var sub = esc(L("ord_" + o.kind)) + " · " + esc(fmtDate(o.created_at));
        if (o.status === "refunded") sub += '<br><span style="color:#a5b4fc">' + esc(L("refund_note")) + (o.note ? ": " + esc(o.note) : "") + "</span>";
        if (o.kind === "firstmail" && o.delivery && o.delivery.email) sub += ' · <span style="color:#6ee7b7">' + icon("key") + "</span>";
        return '<button class="item tappable" data-order="' + esc(o.id) + '"><div class="item-ico ' + k.tone + '">' + icon(k.icon) + "</div>" +
          '<div class="grow"><div class="item-title ellipsis">' + esc(orderTitle(o)) + "</div>" +
          '<div class="item-sub">' + sub + "</div></div>" +
          '<div class="item-right"><div class="price-sum" style="font-size:14px">' + esc(orderPrice(o)) + "</div>" +
          '<div style="margin-top:5px"><span class="pill ' + (ORDER_STATUS[o.status] || "gold") + '">' + esc(L("ord_" + o.status)) + "</span></div></div></button>";
      }

      function topupItemHtml(t) {
        var sum = t.paid_amount || t.pay_amount;
        return '<button class="item tappable" data-topup="' + esc(t.id) + '"><div class="item-ico green">' + icon("plus-circle") + "</div>" +
          '<div class="grow"><div class="item-title ellipsis">' + esc(L("ev_topup")) + "</div>" +
          '<div class="item-sub">' + esc(L(t.provider === "manual" ? "m_manual" : "m_hamyon")) + " · " + esc(fmtDate(t.paid_at || t.created_at)) + "</div></div>" +
          '<div class="item-right"><div class="delta plus" style="font-size:14px">+' + esc(som(sum)) + "</div>" +
          '<div style="margin-top:5px"><span class="pill green">' + esc(L("ord_done")) + "</span></div></div></button>";
      }

      // Xaridlar + balansga kiritilgan pullar — vaqt bo'yicha bitta lenta.
      function timeline() {
        var d = state.data;
        var rows = (d.orders || []).map(function (o) { return { at: o.created_at, html: orderItemHtml(o) }; })
          .concat((d.topups || []).map(function (t) { return { at: t.paid_at || t.created_at, html: topupItemHtml(t) }; }));
        rows.sort(function (a, b) { return new Date(b.at).getTime() - new Date(a.at).getTime(); });
        return rows;
      }

      function renderOrders() {
        var d = state.data;
        var rows = timeline();
        var html = '<div class="section-title" style="margin-top:4px">' + esc(L("orders_title")) + (rows.length ? " · " + rows.length : "") + "</div>";
        html += rows.length
          ? rows.map(function (r) { return r.html; }).join("")
          : '<div class="empty">' + icon("receipt") + esc(L(d.ordersAvailable === false ? "no_orders_setup" : "no_orders")).replace(/\n/g, "<br>") + "</div>";
        app.innerHTML = html;
        bindAll("[data-order]", function (el) {
          var o = (state.data.orders || []).filter(function (x) { return String(x.id) === el.dataset.order; })[0];
          if (o) openOrderDetail(o);
        });
        bindAll("[data-topup]", function (el) {
          var t = (state.data.topups || []).filter(function (x) { return String(x.id) === el.dataset.topup; })[0];
          if (t) openTopupDetail(t);
        });
      }

      function detailHead(ico, tone, title, sub) {
        return '<div class="detail-head"><div class="item-ico ' + tone + '">' + icon(ico) + "</div><h2>" + esc(title) + "</h2>" +
          (sub ? '<div class="item-sub">' + sub + "</div>" : "") + "</div>";
      }

      function openOrderDetail(o) {
        var k = ORDER_KINDS[o.kind] || ORDER_KINDS.limit;
        var rows = payRow(L("d_type"), L("ord_" + o.kind));
        if (o.kind === "firstmail" && o.delivery && o.delivery.email) {
          rows += payRow(L("fm_email"), o.delivery.email, o.delivery.email);
          if (o.delivery.password) rows += payRow(L("fm_password"), o.delivery.password, o.delivery.password);
        } else if (o.kind === "limit") {
          rows += payRow(L("d_package"), orderTitle(o));
        } else if (o.title) {
          rows += payRow(L("fm_email"), o.title);
        }
        rows += payRow(L("d_price"), orderPrice(o)) + payRow(L("d_date"), fmtDate(o.created_at)) + payRow(L("d_order"), "#" + o.id, String(o.id));
        if (o.status === "refunded") {
          rows += payRow(L("d_refunded_at"), fmtDate(o.refunded_at)) + (o.note ? payRow(L("d_reason"), o.note) : "");
        }
        var manual = o.status === "pending" && !o.paid;
        var sheet = openSheet(detailHead(k.icon, k.tone, orderTitle(o),
          '<span class="pill ' + (ORDER_STATUS[o.status] || "gold") + '">' + esc(L("ord_" + o.status)) + "</span>") +
          '<div class="paybox">' + rows + "</div>" +
          (o.status === "refunded" ? '<div class="hint" style="text-align:center">' + esc(L("refund_note")) + "</div>" : "") +
          (manual ? '<div class="hint" style="text-align:center">' + esc(L("d_manual_hint")) + "</div>" +
            (state.data.supportUsername ? '<button class="btn primary" id="dContact">' + icon("chat-dots") + esc(L("contact")) + "</button>" : "") : "") +
          '<button class="btn" id="resClose">' + esc(L("close")) + "</button>");
        bindCopy(sheet);
        var c = sheet.querySelector("#dContact");
        if (c) c.addEventListener("click", contactAdmin);
        sheet.querySelector("#resClose").addEventListener("click", closeSheet);
      }

      function openTopupDetail(t) {
        var rows = payRow(L("d_paid_sum"), som(t.paid_amount || t.pay_amount)) +
          payRow(L("d_requested"), som(t.amount)) +
          payRow(L("d_paid_at"), fmtDate(t.paid_at)) +
          payRow(L("d_created"), fmtDate(t.created_at)) +
          payRow(L("d_method"), L(t.provider === "manual" ? "m_manual" : (t.provider === "hamyon" ? "m_hamyon" : "m_hamyon"))) +
          (t.reference ? payRow(L("d_ref"), t.reference, t.reference) : "");
        var sheet = openSheet(detailHead("plus-circle", "green", "+" + som(t.paid_amount || t.pay_amount),
          '<span class="pill green">' + esc(L("ev_topup")) + "</span>") +
          '<div class="paybox">' + rows + "</div>" +
          '<button class="btn" id="resClose">' + esc(L("close")) + "</button>");
        bindCopy(sheet);
        sheet.querySelector("#resClose").addEventListener("click", closeSheet);
      }

      function rememberOrder(result) {
        if (!result || !result.ok || !result.order) return;
        state.data.orders = [result.order].concat(state.data.orders || []);
        if (state.mode === "shop" && currentTab() === "orders") renderOrders();
      }

      function loadMoreFirstmails() {
        var d = state.data;
        if (state.fmLoading || !d.firstmailHasMore) return;
        state.fmLoading = true;
        api("firstmails", { offset: d.firstmails.length }).then(function (result) {
          state.fmLoading = false;
          if (!result.ok) { toast(L("error_text")); return; }
          var known = {};
          d.firstmails.forEach(function (f) { known[f.id] = true; });
          var fresh = (result.items || []).filter(function (f) { return !known[f.id]; });
          d.firstmails = d.firstmails.concat(fresh);
          d.firstmailTotal = result.total;
          d.firstmailHasMore = Boolean(result.hasMore) && fresh.length > 0;

          var list = document.getElementById("fmList");
          if (state.mode !== "shop" || currentTab() !== "mail" || !list) return;
          list.insertAdjacentHTML("beforeend", fresh.map(fmItemHtml).join(""));
          bindFmItems(list);
          var more = document.getElementById("fmMore");
          if (more && !d.firstmailHasMore) {
            more.classList.add("hidden");
            if (fmObserver) { fmObserver.disconnect(); fmObserver = null; }
          } else if (more && fmObserver) {
            // Ekran hali to'lmagan bo'lsa — kuzatuvchini qayta ishga tushiramiz.
            fmObserver.unobserve(more);
            fmObserver.observe(more);
          }
        });
      }

      function render() {
        if (!state.data) return;
        if (fmObserver) { fmObserver.disconnect(); fmObserver = null; }
        var views = state.mode === "shop"
          ? { mail: renderShop, limits: renderLimits, donat: renderDonat, orders: renderOrders }
          : { home: renderHome, accounts: renderAccounts, history: renderHistory };
        (views[currentTab()] || views[Object.keys(views)[0]])();
      }

      function bindAll(selector, fn) {
        Array.prototype.forEach.call(app.querySelectorAll(selector), function (el) {
          el.addEventListener("click", function () { fn(el); });
        });
      }

      // ---------------------------------------------------------------- prices / buying
      function kindAmountText(item) {
        return item.amount + " " + L("pcs");
      }

      // Limit paketlari ro'yxati (Do'kon → Limitlar).
      function priceListHtml() {
        var prices = state.data.prices;
        if (!prices.length) {
          return '<div class="empty">' + icon("tag") + esc(L("no_prices")) + "</div>" +
            (state.data.supportUsername ? '<button class="btn primary" id="pricesContact">' + icon("chat-dots") + esc(L("contact")) + "</button>" : "");
        }
        var html = "";
        Object.keys(KINDS).forEach(function (kind) {
          var items = prices.filter(function (p) { return p.kind === kind; });
          if (!items.length) return;
          html += '<div class="price-group">' + icon(KINDS[kind].icon) + esc(L("lim_" + kind).replace(/ ·.*$/, "")) + "</div>";
          html += items.map(function (p) {
            var unit = p.amount > 0 ? L("per_unit", { p: som(p.price / p.amount) }) : "";
            return '<button class="price' + (p.hit ? " hit" : "") + '" data-price="' + esc(p.id) + '">' +
              '<div class="grow"><div class="price-amount">' + esc(p.amount) + " <small>" + esc(L("pcs")) + "</small></div>" +
              ((p.title || p.hit) ? '<div style="margin-top:6px">' + (p.hit ? '<span class="pill gold">🔥 ' + esc(L("hit")) + "</span> " : "") + (p.title ? '<span class="pill">' + esc(p.title) + "</span>" : "") + "</div>" : "") +
              (p.note ? '<div class="price-unit">' + esc(p.note) + "</div>" : "") + "</div>" +
              '<div class="item-right"><div class="price-sum">' + esc(som(p.price)) + '</div><div class="price-unit">' + esc(unit) + "</div></div></button>";
          }).join("");
        });
        return html;
      }

      function renderLimits() {
        var html = '<div class="section-title" style="margin-top:4px">' + esc(L("limits")) + "</div>" +
          '<div class="limits">' + limitCard("full_info") + limitCard("reset_pw") + "</div>" +
          '<div class="section-title">' + esc(L("prices_title")) + "</div>" +
          '<div class="item-sub" style="margin:-4px 2px 12px">' + esc(L("prices_lead")) + "</div>" +
          priceListHtml();
        app.innerHTML = html;
        var contactBtn = document.getElementById("pricesContact");
        if (contactBtn) contactBtn.addEventListener("click", contactAdmin);
        bindAll("[data-price]", function (el) { buyLimit(null, el.dataset.price); });
      }

      // Bosh sahifadagi "Qo'shimcha limit sotib olish" → Do'kon → Limitlar.
      function openShopLimits() {
        state.tabs.shop = "limits";
        if (state.mode === "shop") { renderNav(); render(); return; }
        switchMode("shop");
      }

      function showBuyResult(sheet, result) {
        if (result.ok) {
          haptic("success");
          setSheet(sheet, '<div class="result"><div class="big">' + icon("check2") + "</div><h2>" + esc(L("sent_title")) + "</h2><p>" + esc(L("sent_text")) + "</p>" +
            (state.data.supportUsername ? '<button class="btn green" id="resContact">' + icon("chat-dots") + esc(L("contact")) + "</button>" : "") +
            '<button class="btn" id="resClose">' + esc(L("close")) + "</button></div>");
        } else {
          haptic("error");
          var text = result.error === "not_available" ? L("not_available")
            : result.error === "notify_failed" ? L("notify_failed") : errText(result.error);
          setSheet(sheet, '<div class="result"><div class="big warn">' + icon("exclamation-lg") + "</div><h2>" + esc(L("error_title")) + "</h2><p>" + esc(text) + "</p>" +
            (state.data.supportUsername ? '<button class="btn primary" id="resContact">' + icon("chat-dots") + esc(L("contact")) + "</button>" : "") +
            '<button class="btn" id="resClose">' + esc(L("close")) + "</button></div>");
        }
        var c = sheet.querySelector("#resContact");
        if (c) c.addEventListener("click", contactAdmin);
        sheet.querySelector("#resClose").addEventListener("click", closeSheet);
      }

      function sheetLoading(sheet) {
        setSheet(sheet, '<div class="skeleton" style="height:120px"></div><div class="skeleton"></div>');
      }

      function buyLimit(sheet, id) {
        var item = state.data.prices.filter(function (p) { return p.id === id; })[0];
        if (!item) return;
        haptic("medium");
        var what = L("lim_" + item.kind).replace(/ ·.*$/, "") + " × " + kindAmountText(item);
        if (lacksMoney(item.price)) { showNoMoney(sheet || openSheet(""), item.price, wallet().balance); return; }
        confirmAction(L("pay_confirm", { what: what, price: som(item.price) })).then(function (ok) {
          if (!ok || (sheet && !sheet.isConnected)) return;
          if (!sheet) sheet = openSheet("");
          sheetLoading(sheet);
          api("buy_limit", { id: id }).then(function (result) {
            rememberOrder(result);
            if (typeof result.balance === "number") setBalance(result.balance);
            if (result.ok && result.limit && state.data.limits[result.limit.kind]) {
              state.data.limits[result.limit.kind].remaining = result.limit.remaining;
              render();
            }
            if (!sheet.isConnected) return;
            if (result.ok) {
              haptic("success");
              showDone(sheet, L("lim_done_title"), L("lim_done_text", { what: what, price: som(item.price) }));
            } else if (result.error === "insufficient_funds") {
              showNoMoney(sheet, result.price || item.price, result.balance);
            } else {
              showBuyResult(sheet, result);
            }
          });
        });
      }

      function buyFirstmail(id) {
        var fm = state.data.firstmails.filter(function (f) { return f.id === id; })[0];
        if (!fm) return;
        haptic("medium");
        // Narxi kelishiladigan pochta — eski yo'l: so'rov adminga.
        var paid = Boolean(fm.price) && Boolean(wallet());
        var price = fm.price ? som(fm.price) : (fm.price_text || L("price_agreed"));
        if (paid && lacksMoney(fm.price)) { showNoMoney(openSheet(""), fm.price, wallet().balance); return; }
        var question = paid ? L("pay_confirm", { what: "Firstmail " + fm.email, price: price }) : L("buy_confirm", { what: "Firstmail " + fm.email, price: price });
        confirmAction(question).then(function (ok) {
          if (!ok) return;
          var sheet = openSheet('<div class="skeleton" style="height:120px"></div>');
          api("buy_firstmail", { id: id }).then(function (result) {
            rememberOrder(result);
            if (typeof result.balance === "number") setBalance(result.balance);
            var gone = (result.ok && result.delivery) || result.error === "not_available";
            if (gone) {
              state.data.firstmails = state.data.firstmails.filter(function (f) { return f.id !== id; });
              state.data.firstmailTotal = Math.max(0, (state.data.firstmailTotal || 1) - 1);
              render();
            }
            if (!sheet.isConnected) return;
            if (result.ok && result.delivery) {
              haptic("success");
              showCreds(sheet, result.delivery, L("fm_done_title"), L("fm_done_text"));
            } else if (result.error === "insufficient_funds") {
              showNoMoney(sheet, result.price || fm.price, result.balance);
            } else {
              showBuyResult(sheet, result);
            }
          });
        });
      }

      // ---------------------------------------------------------------- wallet
      function wallet() { return state.data && state.data.wallet; }

      function lacksMoney(price) {
        var w = wallet();
        return Boolean(w) && Number(price) > 0 && w.balance < Number(price);
      }

      // Header'dagi balans tugmasi ($ o'rnida).
      function balanceBtnHtml() {
        var w = wallet();
        var label = esc(L("w_balance"));
        if (!w) return '<button class="bal-btn off" id="balBtn" aria-label="' + label + '"><span class="bal-ico">' + icon("wallet2") + '</span><span class="bal-sum">—</span></button>';
        var pending = w.topup && w.topup.status === "pending";
        return '<button class="bal-btn" id="balBtn" aria-label="' + label + ": " + esc(som(w.balance)) + '">' +
          (pending ? '<span class="bal-dot"></span>' : "") + '<span class="bal-ico">' + icon("wallet2") + "</span>" +
          '<span class="bal-sum">' + esc(num(w.balance)) + " <small>" + esc(L("som")) + "</small></span></button>";
      }

      function refreshBalanceBtn() {
        var btn = document.getElementById("balBtn");
        if (!btn) return;
        btn.outerHTML = balanceBtnHtml();
        document.getElementById("balBtn").addEventListener("click", openWalletSheet);
      }

      // Balans oynasi: joriy balans, to'ldirish va balans tarixi.
      function openWalletSheet() {
        var w = wallet();
        if (!w) { toast(errText("wallet_unavailable")); return; }
        var pending = w.topup && w.topup.status === "pending";
        var sheet = openSheet('<div class="wsheet"><div class="w-ico">' + icon("wallet2") + "</div>" +
          '<div class="w-label">' + esc(L("w_balance")) + "</div>" +
          '<div class="w-big">' + esc(num(w.balance)) + " <small>" + esc(L("som")) + "</small></div>" +
          (pending ? '<span class="pill gold">' + icon("hourglass-split") + " " + esc(L("w_pending_hint", { sum: som(w.topup.pay_amount) })) + "</span>" : "") +
          '<button class="btn green" id="wsTopup">' + icon("plus-lg") + esc(L("w_topup_full")) + "</button>" +
          '<button class="btn" id="wsHistory">' + icon("clock-history") + esc(L("w_history")) + "</button></div>");
        sheet.querySelector("#wsTopup").addEventListener("click", function () { openTopup(); });
        sheet.querySelector("#wsHistory").addEventListener("click", openWalletHistory);
      }


      function setBalance(balance) {
        var w = wallet();
        if (!w || typeof balance !== "number") return;
        w.balance = balance;
        refreshBalanceBtn();
      }

      function copyText(text) {
        var done = function () { haptic("select"); toast(L("copied")); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text); done(); });
        } else {
          legacyCopy(text);
          done();
        }
      }
      function legacyCopy(text) {
        var area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "");
        area.style.position = "fixed";
        area.style.opacity = "0";
        document.body.appendChild(area);
        area.select();
        try { document.execCommand("copy"); } catch (e) { /* noop */ }
        document.body.removeChild(area);
      }
      function bindCopy(root) {
        Array.prototype.forEach.call(root.querySelectorAll("[data-copy]"), function (el) {
          el.addEventListener("click", function () { copyText(el.dataset.copy); });
        });
      }

      function payRow(label, value, copy, big) {
        return '<div class="payrow"><div class="grow"><div class="k">' + esc(label) + '</div><div class="v' + (big ? " big" : "") + '">' + esc(value) + "</div></div>" +
          (copy ? '<button class="copy" data-copy="' + esc(copy) + '" aria-label="copy">' + icon("copy") + "</button>" : "") + "</div>";
      }

      function showDone(sheet, title, text) {
        setSheet(sheet, '<div class="result"><div class="big">' + icon("check2") + "</div><h2>" + esc(title) + "</h2><p>" + esc(text) + "</p>" +
          '<button class="btn" id="resClose">' + esc(L("close")) + "</button></div>");
        sheet.querySelector("#resClose").addEventListener("click", closeSheet);
      }

      function showCreds(sheet, d, title, text) {
        setSheet(sheet, '<div class="result creds"><div class="big">' + icon("envelope-check") + '</div><h2 style="text-align:center">' + esc(title) + "</h2>" +
          (text ? '<p style="text-align:center">' + esc(text) + "</p>" : "") +
          '<div class="paybox">' + payRow(L("fm_email"), d.email, d.email) + (d.password ? payRow(L("fm_password"), d.password, d.password) : "") + "</div>" +
          '<button class="btn" id="resClose">' + esc(L("close")) + "</button></div>");
        bindCopy(sheet);
        sheet.querySelector("#resClose").addEventListener("click", closeSheet);
      }

      function showNoMoney(sheet, price, balance) {
        haptic("warning");
        var need = Math.max(0, Number(price) - Number(balance || 0));
        setSheet(sheet, '<div class="result"><div class="big warn">' + icon("wallet2") + "</div><h2>" + esc(L("no_money_title")) + "</h2><p>" +
          esc(L("no_money_text", { price: som(price), bal: som(balance), need: som(need) })) + "</p>" +
          '<button class="btn green" id="resTopup">' + icon("plus-lg") + esc(L("no_money_btn")) + "</button>" +
          '<button class="btn" id="resClose">' + esc(L("close")) + "</button></div>");
        sheet.querySelector("#resTopup").addEventListener("click", function () { openTopup(need); });
        sheet.querySelector("#resClose").addEventListener("click", closeSheet);
      }

      // ---- to'ldirish
      var topupPoll = null;
      var topupClock = null;
      var paySheet = null; // ochiq "Kartaga o'tkazing" oynasi (qaytib kirganda darhol tekshiriladi)
      function stopTopupTimers() {
        clearInterval(topupPoll); topupPoll = null;
        clearInterval(topupClock); topupClock = null;
      }

      function openTopup(shortfall) {
        var w = wallet();
        if (!w) { toast(errText("wallet_unavailable")); return; }
        var cfg = w.config;
        if (!cfg.enabled) {
          var off = openSheet("<h2>" + esc(L("tp_title")) + '</h2><p class="lead">' + esc(L("w_disabled")) + "</p>" +
            (state.data.supportUsername ? '<button class="btn primary" id="sheetContact">' + icon("chat-dots") + esc(L("contact")) + "</button>" : ""));
          var c = off.querySelector("#sheetContact");
          if (c) c.addEventListener("click", contactAdmin);
          return;
        }
        if (w.topup && w.topup.status === "pending" && !shortfall) {
          showPayStep(openSheet(""), w.topup);
          return;
        }

        // Yetishmagan summa 1 000 ga yaxlitlanadi va chegaraga keltiriladi.
        var preset = shortfall ? Math.min(cfg.max, Math.max(cfg.min, Math.ceil(shortfall / 1000) * 1000)) : "";
        var sheet = openSheet("<h2>" + esc(L("tp_title")) + '</h2><p class="lead">' + esc(L("tp_lead")) + "</p>" +
          '<div class="chips">' + cfg.presets.map(function (p) {
            return '<button class="chip' + (p === preset ? " active" : "") + '" data-chip="' + p + '">' + esc(num(p)) + "</button>";
          }).join("") + "</div>" +
          '<div class="field"><label>' + esc(L("tp_amount")) + '</label><input id="tpAmount" inputmode="numeric" maxlength="12" placeholder="' + esc(num(cfg.min)) + '" value="' + esc(preset ? num(preset) : "") + '"></div>' +
          '<div class="hint">' + esc(L("tp_range", { min: som(cfg.min), max: som(cfg.max) })) + "</div>" +
          '<button class="btn green" id="tpNext">' + icon("arrow-right") + esc(L("tp_next")) + "</button>");
        var input = sheet.querySelector("#tpAmount");
        var chips = sheet.querySelectorAll("[data-chip]");
        Array.prototype.forEach.call(chips, function (el) {
          el.addEventListener("click", function () {
            haptic("select");
            Array.prototype.forEach.call(chips, function (x) { x.classList.toggle("active", x === el); });
            input.value = num(el.dataset.chip);
          });
        });
        input.addEventListener("input", function () {
          var digits = input.value.replace(/\D/g, "").slice(0, 10);
          input.value = digits ? num(digits) : "";
          Array.prototype.forEach.call(chips, function (x) { x.classList.toggle("active", x.dataset.chip === digits); });
        });
        sheet.querySelector("#tpNext").addEventListener("click", function () {
          var btn = this;
          var amount = Number(input.value.replace(/\D/g, ""));
          if (!amount || amount < cfg.min || amount > cfg.max) {
            haptic("error");
            toast(L("tp_range", { min: som(cfg.min), max: som(cfg.max) }));
            input.focus();
            return;
          }
          setBusy(btn, true);
          api("topup_create", { amount: amount }).then(function (result) {
            setBusy(btn, false);
            if (!result.ok) { haptic("error"); toast(errText(result.error)); return; }
            haptic("success");
            w.topup = result.topup;
            refreshBalanceBtn();
            if (sheet.isConnected) showPayStep(sheet, result.topup);
          });
        });
      }

      function showPayStep(sheet, topup) {
        var cfg = wallet().config;
        stopTopupTimers();
        paySheet = { sheet: sheet, topup: topup };
        var sum = som(topup.pay_amount);
        // Hamyon har bir to'lovga o'z kartasini beradi; bo'lmasa — admin kartasi.
        var payCard = topup.card ? String(topup.card).replace(/\D/g, "").replace(/(\d{4})(?=\d)/g, "$1 ") : cfg.card;
        setSheet(sheet, "<h2>" + esc(L("tp_pay_title")) + "</h2>" +
          '<div class="paybox">' +
          (payCard ? payRow(L("tp_card"), payCard + (!topup.card && cfg.bank ? " · " + cfg.bank : ""), payCard.replace(/\s/g, "")) : "") +
          (cfg.card && !topup.card && cfg.holder ? payRow(L("tp_holder"), cfg.holder) : "") +
          payRow(L("tp_exact"), sum, String(topup.pay_amount), true) + "</div>" +
          '<div class="warnbox">' + icon("exclamation-triangle") + " " + esc(L("tp_warn", { sum: sum })) + "</div>" +
          (cfg.auto
            ? '<div class="waiting"><div class="spinner"></div><span>' + esc(L("tp_waiting")) + "</span></div>"
            : '<div class="hint" style="text-align:center">' + esc(L("tp_manual")) + "</div>") +
          '<div class="hint" style="text-align:center" id="tpClock"></div>' +
          (topup.pay_url ? '<button class="btn primary" id="tpPage">' + icon("box-arrow-up-right") + esc(L("tp_open_page")) + "</button>" : "") +
          '<button class="btn green" id="tpCheck">' + icon("arrow-repeat") + esc(L("tp_check")) + "</button>" +
          (!cfg.auto && state.data.supportUsername ? '<button class="btn" id="tpContact">' + icon("chat-dots") + esc(L("contact")) + "</button>" : "") +
          '<button class="link-btn" id="tpCancel">' + esc(L("tp_cancel")) + "</button>");
        bindCopy(sheet);

        var clock = sheet.querySelector("#tpClock");
        var expires = new Date(topup.expires_at).getTime();
        function tick() {
          if (!clock.isConnected) { stopTopupTimers(); return; }
          var left = Math.max(0, Math.round((expires - Date.now()) / 1000));
          if (!left) { showExpired(sheet); return; }
          clock.textContent = L("tp_expires", { t: Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0") });
        }
        tick();
        topupClock = setInterval(tick, 1000);
        // Hamyon tavsiyasi: 3–5 s oralig'ida tekshirish.
        if (cfg.auto) topupPoll = setInterval(function () { checkTopup(sheet, topup, true); }, 5000);
        var page = sheet.querySelector("#tpPage");
        if (page) page.addEventListener("click", function () {
          if (tg && tg.openLink) { try { tg.openLink(topup.pay_url); return; } catch (e) { /* fallback */ } }
          window.open(topup.pay_url, "_blank");
        });

        sheet.querySelector("#tpCheck").addEventListener("click", function () { checkTopup(sheet, topup, false, this); });
        var contact = sheet.querySelector("#tpContact");
        if (contact) contact.addEventListener("click", contactAdmin);
        sheet.querySelector("#tpCancel").addEventListener("click", function () {
          api("topup_cancel", { id: topup.id });
          wallet().topup = null;
          refreshBalanceBtn();
          closeSheet();
        });
      }

      function showExpired(sheet) {
        stopTopupTimers();
        wallet().topup = null;
        refreshBalanceBtn();
        setSheet(sheet, '<div class="result"><div class="big warn">' + icon("hourglass-bottom") + "</div><h2>" + esc(L("tp_title")) + "</h2><p>" + esc(L("tp_expired")) + "</p>" +
          '<button class="btn green" id="tpRenew">' + icon("plus-lg") + esc(L("tp_new")) + "</button>" +
          '<button class="btn" id="resClose">' + esc(L("close")) + "</button></div>");
        sheet.querySelector("#tpRenew").addEventListener("click", function () { openTopup(); });
        sheet.querySelector("#resClose").addEventListener("click", closeSheet);
      }

      var topupChecking = false;
      function checkTopup(sheet, topup, silent, btn) {
        if (topupChecking) return;
        topupChecking = true;
        setBusy(btn, true);
        api("topup_check", { id: topup.id }).then(function (result) {
          topupChecking = false;
          setBusy(btn, false);
          if (!sheet.isConnected) return;
          var status = result.topup && result.topup.status;
          if (status === "paid") {
            stopTopupTimers();
            closeSheet();
            onTopupPaid(result.topup, result.balance);
            return;
          }
          if (status === "expired" || status === "cancelled") { showExpired(sheet); return; }
          if (!silent) {
            haptic(result.ok ? "warning" : "error");
            toast(result.ok ? L("tp_not_yet") : errText(result.error));
          }
        });
      }

      // ---- to'lov qabul qilindi: tabrik animatsiyasi
      // Foydalanuvchi kartani nusxalab, bank ilovasida o'tkazib qaytguncha
      // to'lov ko'pincha tasdiqlanib bo'ladi (Hamyon callback). Shuning uchun
      // ilova ochilganda va unga qaytilganda yangi tasdiqlangan to'ldirishlar
      // tekshiriladi; har biri faqat bir marta ko'rsatiladi.
      var CEL_SEEN_KEY = "mlbb_topups_celebrated";
      var CEL_WINDOW_MS = 30 * 60 * 1000;
      var celSeenMemory = [];

      function celSeen() {
        try {
          var list = JSON.parse(localStorage.getItem(CEL_SEEN_KEY) || "[]");
          return Array.isArray(list) ? list.map(String) : celSeenMemory;
        } catch (e) { return celSeenMemory; }
      }
      function markCelSeen(ids) {
        var list = celSeen();
        ids.forEach(function (id) { if (list.indexOf(String(id)) < 0) list.push(String(id)); });
        list = list.slice(-40);
        celSeenMemory = list;
        try { localStorage.setItem(CEL_SEEN_KEY, JSON.stringify(list)); } catch (e) { /* xotira yopiq */ }
      }

      // Ilova ochilganda: so'nggi 30 daqiqada tasdiqlangan, hali ko'rsatilmagan to'ldirishlar.
      function celebrateFreshTopups() {
        var w = wallet();
        if (!w) return;
        var seen = celSeen();
        var fresh = (state.data.topups || []).filter(function (t) {
          var at = new Date(t.paid_at || 0).getTime();
          return t.status === "paid" && seen.indexOf(String(t.id)) < 0 && isFinite(at) && Date.now() - at < CEL_WINDOW_MS;
        });
        if (!fresh.length) return;
        markCelSeen(fresh.map(function (t) { return t.id; }));
        var total = fresh.reduce(function (sum, t) { return sum + (Number(t.paid_amount) || Number(t.pay_amount) || 0); }, 0);
        celebrate(total, w.balance);
      }

      function onTopupPaid(topup, balance) {
        var w = wallet();
        if (w) w.topup = null;
        state.data.topups = [topup].concat((state.data.topups || []).filter(function (x) { return x.id !== topup.id; }));
        if (state.mode === "shop" && currentTab() === "orders") renderOrders();
        setBalance(balance);
        if (celSeen().indexOf(String(topup.id)) >= 0) return;
        markCelSeen([topup.id]);
        celebrate(Number(topup.paid_amount) || Number(topup.pay_amount) || 0, typeof balance === "number" ? balance : (w ? w.balance : 0));
      }

      // Bank ilovasidan qaytdi: kutilayotgan to'lovni darhol tekshiramiz.
      var resumeChecking = false;
      function checkOnResume() {
        if (document.visibilityState === "hidden" || !state.data) return;
        if (paySheet && paySheet.sheet.isConnected) { checkTopup(paySheet.sheet, paySheet.topup, true); return; }
        var w = wallet();
        var pending = w && w.topup && w.topup.status === "pending" ? w.topup : null;
        if (!pending || resumeChecking) return;
        resumeChecking = true;
        api("topup_check", { id: pending.id }).then(function (result) {
          resumeChecking = false;
          var status = result.topup && result.topup.status;
          if (status === "paid") onTopupPaid(result.topup, result.balance);
          else if (status === "expired" || status === "cancelled") { w.topup = null; refreshBalanceBtn(); }
        });
      }

      function celebrate(amount, balance) {
        var old = document.querySelector(".cel");
        if (old) old.remove();
        haptic("success");
        var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var colors = ["#34d399", "#10b981", "#fde68a", "#f59e0b", "#8b5cf6", "#ec4899", "#60a5fa", "#ffffff"];
        var pieces = "";
        for (var i = 0; i < (reduce ? 0 : 46); i++) {
          var angle = Math.random() * Math.PI * 2;
          var dist = 120 + Math.random() * 190;
          pieces += '<i class="' + (i % 3 === 0 ? "dot" : "") + '" style="background:' + colors[i % colors.length] +
            ";--x:" + Math.round(Math.cos(angle) * dist) + "px;--y:" + Math.round(Math.sin(angle) * dist * 0.85 + 140) + "px" +
            ";--r:" + Math.round(Math.random() * 720 - 360) + "deg;--d:" + (0.45 + Math.random() * 0.25).toFixed(2) + "s" +
            ";--t:" + (1.3 + Math.random() * 0.9).toFixed(2) + 's"></i>';
        }
        var el = document.createElement("div");
        el.className = "cel";
        el.setAttribute("role", "dialog");
        el.setAttribute("aria-live", "assertive");
        el.innerHTML = '<div class="cel-confetti">' + pieces + "</div>" +
          '<div class="cel-card">' +
          '<div class="cel-ring"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="celGrad" x1="0" y1="0" x2="1" y2="1">' +
          '<stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></linearGradient></defs>' +
          '<circle class="disc" cx="50" cy="50" r="46"/><path class="tick" d="M30 52 L44 65 L71 37"/></svg></div>' +
          '<div class="cel-title">' + esc(L("cel_title")) + "</div>" +
          '<div class="cel-sum">+<span data-cel-num>' + esc(num(reduce ? amount : 0)) + "</span> <small>UZS</small></div>" +
          '<div class="cel-text">' + esc(L("cel_text", { sum: num(amount) })) + "</div>" +
          '<div class="cel-bal">' + icon("wallet2") + " " + esc(L("cel_balance")) + " <b>" + esc(som(balance)) + "</b></div>" +
          '<button class="btn green" data-cel-close>' + icon("check2") + esc(L("cel_ok")) + "</button></div>";
        document.body.appendChild(el);

        // Summa 0 dan sanab chiqadi.
        if (!reduce) {
          var target = el.querySelector("[data-cel-num]");
          var start = 0;
          var step = function (now) {
            if (!start) start = now;
            var p = Math.min(1, (now - start - 650) / 950);
            if (p > 0) target.textContent = num(amount * (1 - Math.pow(1 - p, 3)));
            if (p < 1 && el.isConnected) requestAnimationFrame(step);
          };
          requestAnimationFrame(step);
        }

        var close = function () {
          if (el.classList.contains("closing")) return;
          haptic("light");
          el.classList.add("closing");
          setTimeout(function () { el.remove(); }, 260);
        };
        el.querySelector("[data-cel-close]").addEventListener("click", close);
        el.addEventListener("click", function (event) { if (event.target === el) close(); });
      }

      // ---- balans tarixi
      var TX = {
        topup: { icon: "plus-circle", tone: "green" },
        purchase: { icon: "bag", tone: "pink" },
        refund: { icon: "arrow-counterclockwise", tone: "green" },
        admin: { icon: "person-gear", tone: "" }
      };

      function txItemHtml(t) {
        var k = TX[t.kind] || TX.admin;
        var plus = t.delta > 0;
        var note = t.kind === "refund" || t.kind === "admin" ? t.note : "";
        return '<div class="item"><div class="item-ico ' + k.tone + '">' + icon(k.icon) + "</div>" +
          '<div class="grow"><div class="item-title ellipsis">' + esc(L("tx_" + t.kind)) + "</div>" +
          '<div class="item-sub">' + esc(timeAgo(t.created_at)) + (note ? " · " + esc(note) : "") + "</div></div>" +
          '<div class="item-right"><div class="delta ' + (plus ? "plus" : "minus") + '">' + (plus ? "+" : "−") + esc(num(Math.abs(t.delta))) + "</div>" +
          '<div class="price-unit">' + esc(som(t.balance_after)) + "</div></div></div>";
      }

      function openWalletHistory() {
        var sheet = openSheet("<h2>" + esc(L("w_history")) + '</h2><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>');
        api("wallet").then(function (result) {
          if (!sheet.isConnected) return;
          if (!result.ok) { setSheet(sheet, "<h2>" + esc(L("w_history")) + '</h2><p class="lead">' + esc(errText(result.error)) + "</p>"); return; }
          var w = wallet();
          if (w) { w.topup = result.topup; w.config = result.config; }
          setBalance(result.balance);
          var list = result.transactions || [];
          setSheet(sheet, "<h2>" + esc(L("w_history")) + "</h2>" +
            '<div style="margin:-4px 0 14px"><span class="pill green">' + icon("wallet2") + " " + esc(L("w_balance")) + ": " + esc(som(result.balance)) + "</span></div>" +
            (list.length ? list.map(txItemHtml).join("") : '<div class="empty">' + icon("wallet2") + esc(L("no_tx")) + "</div>"));
        });
      }

      // ---------------------------------------------------------------- accounts
      function openAddAccount() {
        var sheet = openSheet("<h2>" + esc(L("add_title")) + '</h2><p class="lead">' + esc(L("add_lead")) + "</p>" +
          '<div class="fields2"><div class="field"><label>' + esc(L("f_account")) + '</label><input id="fAcc" inputmode="numeric" maxlength="12" placeholder="123456789"></div>' +
          '<div class="field"><label>' + esc(L("f_zone")) + '</label><input id="fZone" inputmode="numeric" maxlength="8" placeholder="2001"></div></div>' +
          '<button class="btn primary" id="fSave">' + icon("plus-lg") + esc(L("save")) + "</button>");
        var accInput = sheet.querySelector("#fAcc");
        var zoneInput = sheet.querySelector("#fZone");
        // "123456 (2001)" ni bitta maydonga tashlansa — ikkiga ajratamiz.
        accInput.addEventListener("input", function () {
          var m = accInput.value.match(/^\s*(\d{5,12})\D+(\d{1,8})\D*$/);
          if (m) { accInput.value = m[1]; zoneInput.value = m[2]; zoneInput.focus(); }
        });
        setTimeout(function () { accInput.focus(); }, 300);
        sheet.querySelector("#fSave").addEventListener("click", function () {
          var btn = this;
          var accountId = accInput.value.replace(/\D/g, "");
          var zoneId = zoneInput.value.replace(/\D/g, "");
          if (!/^\d{5,12}$/.test(accountId) || !/^\d{1,8}$/.test(zoneId)) { haptic("error"); toast(errText("invalid_input")); return; }
          setBusy(btn, true);
          api("account_add", { account_id: accountId, zone_id: zoneId }).then(function (result) {
            setBusy(btn, false);
            if (!result.ok) { haptic("error"); toast(errText(result.error || "add_failed")); return; }
            haptic("success");
            state.data.accounts = result.accounts || state.data.accounts;
            closeSheet();
            render();
            toast(L("added"));
            var added = state.data.accounts.filter(function (a) { return a.account_id === accountId && a.zone_id === zoneId; })[0];
            if (added && !added.ml_linked) setTimeout(function () { openLink(added.id); }, 450);
          });
        });
      }

      function removeAccount(rowId, btn) {
        var a = findAccount(rowId);
        if (!a) return;
        haptic("warning");
        confirmAction(L("remove_confirm", { acc: acc(a) })).then(function (ok) {
          if (!ok) return;
          setBusy(btn, true);
          api("account_remove", { rowId: rowId }).then(function (result) {
            if (!result.ok) { setBusy(btn, false); haptic("error"); toast(errText(result.error)); return; }
            haptic("success");
            state.data.accounts = result.accounts || state.data.accounts.filter(function (x) { return x.id !== rowId; });
            render();
            toast(L("removed"));
          });
        });
      }

      function findAccount(rowId) {
        return state.data.accounts.filter(function (a) { return a.id === rowId; })[0] || null;
      }

      // "Mening akkauntim" (MLBB statistika) — o'sha Vercel funksiyasi, view'siz.
      // initData sessionStorage orqali saqlanadi (telegram-web-app.js), orqaga
      // qaytish uchun belgi qo'yamiz.
      function openMlAccount(rowId) {
        haptic("light");
        try {
          localStorage.setItem("mlbb_account_row", rowId);
          sessionStorage.setItem("from_cabinet", "1");
        } catch (e) { /* noop */ }
        location.href = API_URL;
      }

      // ---------------------------------------------------------------- ML link
      var countdownTimer = null;
      function stopCountdown() { clearInterval(countdownTimer); countdownTimer = null; }

      function openLink(rowId) {
        var a = findAccount(rowId);
        if (!a) return;
        var sheet = openSheet("<h2>" + esc(L("link_title")) + '</h2><p class="lead">' + esc(acc(a)) + " — " + esc(L("link_lead")) + "</p>" +
          '<div id="linkBody"><button class="btn primary" id="sendCode">' + icon("envelope-paper") + esc(L("send_code")) + "</button></div>");
        sheet.querySelector("#sendCode").addEventListener("click", function () { sendCode(sheet, rowId, this); });
      }

      // Arena so'rovlari shu yerdan (telefondan) yuboriladi — serverdan bloklangan
      // (api/_arena-web.js). Qayta yuborish oralig'i va urinishlar shu yerda sanaladi.
      var ML_RESEND_MS = 60 * 1000;
      var ML_MAX_ATTEMPTS = 5;
      var mlCode = null; // { rowId, sentAt, attempts }

      function sendCode(sheet, rowId, btn) {
        var a = findAccount(rowId);
        if (!a) return;
        var since = mlCode && mlCode.rowId === rowId ? Date.now() - mlCode.sentAt : Infinity;
        if (since < ML_RESEND_MS) { showCodeForm(sheet, rowId, Math.ceil((ML_RESEND_MS - since) / 1000)); return; }
        if (!window.ArenaWeb) { toast(errText("service_down")); return; }
        setBusy(btn, true);
        window.ArenaWeb.sendCode(a.account_id, a.zone_id).then(function (result) {
          if (!sheet.isConnected) return;
          setBusy(btn, false);
          if (!result.ok) {
            haptic("error");
            toast(errText(result.error));
            return;
          }
          mlCode = { rowId: rowId, sentAt: Date.now(), attempts: 0 };
          haptic("success");
          toast(L("code_sent"));
          showCodeForm(sheet, rowId, ML_RESEND_MS / 1000);
        });
      }

      function showCodeForm(sheet, rowId, cooldown) {
        var body = sheet.querySelector("#linkBody");
        body.innerHTML = '<div class="field"><label>' + esc(L("f_code")) + '</label><input id="fCode" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="••••"></div>' +
          '<button class="btn primary" id="verifyBtn">' + icon("shield-check") + esc(L("verify")) + "</button>" +
          '<button class="btn" id="resendBtn" disabled></button>';
        var input = body.querySelector("#fCode");
        var resend = body.querySelector("#resendBtn");
        setTimeout(function () { input.focus(); }, 200);

        var left = Number(cooldown) || 60;
        stopCountdown();
        function tick() {
          if (!resend.isConnected) { stopCountdown(); return; }
          if (left <= 0) { stopCountdown(); resend.disabled = false; resend.textContent = L("resend"); return; }
          resend.textContent = L("resend_in", { s: left });
          left -= 1;
        }
        tick();
        countdownTimer = setInterval(tick, 1000);
        resend.addEventListener("click", function () { sendCode(sheet, rowId, resend); });

        body.querySelector("#verifyBtn").addEventListener("click", function () {
          var btn = this;
          var code = input.value.replace(/[\s-]/g, "");
          if (!code) { input.focus(); return; }
          var a = findAccount(rowId);
          if (!a || !mlCode || mlCode.rowId !== rowId) { toast(errText("code_expired")); return; }
          if (mlCode.attempts >= ML_MAX_ATTEMPTS) { toast(errText("too_many")); return; }
          setBusy(btn, true);
          window.ArenaWeb.login(a.account_id, a.zone_id, code, state.lang).then(function (login) {
            if (!login.ok) return login;
            return api("ml_link", { rowId: rowId, token: login.jwt, nickname: login.nickname || "" });
          }).then(function (result) {
            setBusy(btn, false);
            if (!sheet.isConnected) return;
            if (!result.ok) {
              haptic("error");
              if (result.error === "wrong_code") {
                mlCode.attempts += 1;
                var left = ML_MAX_ATTEMPTS - mlCode.attempts;
                toast(left > 0 ? errText("wrong_code", { left: left }) : errText("too_many"));
                input.value = "";
                input.focus();
                return;
              }
              toast(errText(result.error));
              return;
            }
            mlCode = null;
            haptic("success");
            state.data.accounts = result.accounts || state.data.accounts;
            closeSheet();
            render();
            toast(L("linked_ok"));
          });
        });
      }

      // ---------------------------------------------------------------- boot
      function renderState(iconName, title, text, action) {
        app.innerHTML = '<div class="state"><div class="big">' + icon(iconName) + "</div><h2>" + esc(title) + "</h2><p>" + esc(text) + "</p>" +
          (action ? '<button class="btn primary" id="stateBtn">' + esc(action.label) + "</button>" : "") + "</div>";
        if (action) document.getElementById("stateBtn").addEventListener("click", action.onClick);
      }

      function boot() {
        document.getElementById("dock").classList.add("hidden");
        document.getElementById("head").innerHTML = "";
        app.innerHTML = '<div class="skeleton" style="height:56px;margin-bottom:18px"></div><div class="skeleton" style="height:110px"></div>' +
          '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';

        if (!tg || !tg.initData) {
          renderState("phone", L("not_telegram_title"), L("not_telegram_text"));
          return;
        }

        api("cabinet").then(function (result) {
          if (!result.ok) {
            renderState("exclamation-triangle", L("error_title"), L("error_text"), { label: L("retry"), onClick: boot });
            return;
          }
          state.lang = I18N[result.lang] ? result.lang : "uz";
          state.data = result;
          document.documentElement.lang = state.lang;
          document.title = L("title");
          state.fmLoading = false;
          renderHeader();
          renderNav();
          render();
          celebrateFreshTopups();
        });
      }

      // ready / fullscreen / safe area / ranglar — api/_tg-shell.js da.
      if (tg && tg.BackButton) tg.BackButton.onClick(onBack);
      document.addEventListener("visibilitychange", checkOnResume);
      if (tg && tg.onEvent) { try { tg.onEvent("activated", checkOnResume); } catch (e) { /* eski mijozlar */ } }
      document.getElementById("dockSide").addEventListener("click", function () {
        switchMode(state.mode === "main" ? "shop" : "main");
      });
      function syncNav() { moveNavIndicator(document.getElementById("nav"), false); }
      window.addEventListener("resize", syncNav);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncNav);

      boot();
    })();
  </script>
</body>
</html>
