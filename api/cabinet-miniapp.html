<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Shaxsiy kabinet</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Fullscreen + safe area + MLBBBOT yorlig'i: api/_tg-shell.js server tomonda qo'yadi -->
  <!-- tg-shell -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    /* Admin panel bilan bir xil palitra (api/index.html) */
    :root {
      --bg: #0a0e1a;
      /* Fon rasmi ustida o'qilishi uchun biroz to'qroq */
      --surface: rgba(16, 21, 38, 0.82);
      /* Kartalar ortidagi fon rasmi kontentga aralashmasin */
      --surface-blur: blur(24px) saturate(150%);
      --surface2: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8ecf5;
      --text2: #8b95ab;
      --accent: #6366f1;
      --accent2: #8b5cf6;
      --pink: #ec4899;
      --green: #10b981;
      --red: #f43f5e;
      --gold: #f59e0b;
      --sheet: #121729;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      background: transparent; /* .bg-wrap ko'rinsin (html — var(--bg)) */
      padding: calc(12px + var(--top-space, 0px)) calc(16px + var(--safe-right, 0px))
        calc(100px + var(--safe-bottom, 0px)) calc(16px + var(--safe-left, 0px));
    }

    /* Orqa fon — admin paneldagi rasm (api/account.js → ?asset=bg), o'qilishi uchun qoraytirilgan */
    .bg-wrap {
      position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
      background:
        linear-gradient(180deg, rgba(6, 9, 20, 0.62) 0%, rgba(6, 9, 20, 0.48) 45%, rgba(6, 9, 20, 0.78) 100%),
        url("?asset=bg") center / cover no-repeat,
        var(--bg);
    }
    .bg-blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .1; animation: blobFloat 20s ease-in-out infinite alternate; }
    .bg-blob:nth-child(1) { width: 380px; height: 380px; background: var(--accent); top: -110px; left: -110px; }
    .bg-blob:nth-child(2) { width: 320px; height: 320px; background: var(--pink); bottom: -90px; right: -90px; animation-delay: -7s; }
    @keyframes blobFloat { 0% { transform: translate(0, 0) scale(1) } 50% { transform: translate(30px, -30px) scale(1.06) } 100% { transform: translate(-20px, 20px) scale(.96) } }

    #head, #app { transition: opacity .25s; max-width: 560px; margin: 0 auto; }
    html.tg-shell-pending #head, html.tg-shell-pending #app { opacity: 0; }

    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
    input { font: inherit; }
    .hidden { display: none !important; }
    .muted { color: var(--text2); }
    .row { display: flex; align-items: center; gap: 12px; }
    .grow { flex: 1; min-width: 0; }
    .ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ------------------------------------------------------------ header */
    /* Ixcham — ostidagi ma'lumotlarga ko'proq joy qolsin */
    .head {
      display: flex; align-items: center; gap: 10px; margin-bottom: 6px; padding: 7px 7px 7px 8px;
      border-radius: 18px; background: rgba(16, 21, 38, .8); border: 1px solid var(--border);
      -webkit-backdrop-filter: var(--surface-blur); backdrop-filter: var(--surface-blur);
    }
    .avatar {
      width: 36px; height: 36px; border-radius: 12px; flex: none; object-fit: cover;
      display: grid; place-items: center; font-weight: 800; font-size: 15px; color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--pink));
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    .head-name { font-size: 14.5px; font-weight: 700; line-height: 1.2; }
    .head-sub { font-size: 11px; color: var(--text2); margin-top: 1px; }
    .head-sub code { font-family: inherit; color: var(--text); opacity: .8; }

    /* "$" — narxlar ro'yxati. Ikonka tanga kabi aylanib turadi. */
    /* Header: balans tugmasi — bosilganda to'ldirish va balans tarixi */
    .bal-btn {
      position: relative; flex: none; height: 36px; max-width: 46%; padding: 0 12px 0 6px; border-radius: 12px;
      display: flex; align-items: center; gap: 7px; color: #fff;
      background: linear-gradient(135deg, var(--green), #059669);
      box-shadow: 0 8px 22px rgba(16, 185, 129, 0.38), inset 0 1px 0 rgba(255, 255, 255, .2);
      transition: transform .15s;
    }
    .bal-btn::after {
      content: ""; position: absolute; inset: -3px; border-radius: 15px; pointer-events: none;
      border: 1.5px solid rgba(16, 185, 129, .45); animation: pulseRing 2.4s ease-out infinite;
    }
    .bal-btn:active { transform: scale(.94); }
    .bal-btn .bal-ico { width: 26px; height: 26px; flex: none; border-radius: 9px; display: grid; place-items: center; font-size: 14px; background: rgba(255, 255, 255, .18); }
    .bal-btn .bal-sum { min-width: 0; font-size: 14px; font-weight: 800; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bal-btn .bal-sum small { font-size: 11px; font-weight: 700; opacity: .85; }
    .bal-btn .bal-dot { position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); border: 2px solid var(--bg); }
    .bal-btn.off { background: var(--surface2); box-shadow: none; }
    .bal-btn.off::after { display: none; }
    /* Balans oynasi */
    .wsheet { text-align: center; padding: 4px 0 2px; }
    .wsheet .w-ico {
      margin: 0 auto 10px; width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; font-size: 26px; color: #fff;
      background: linear-gradient(135deg, var(--green), #059669); box-shadow: 0 10px 26px rgba(16, 185, 129, .35);
    }
    .wsheet .w-label { font-size: 13px; color: var(--text2); font-weight: 600; }
    .wsheet .w-big { margin: 4px 0 14px; font-size: 34px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .wsheet .w-big small { font-size: 16px; color: var(--text2); font-weight: 700; }
    .wsheet .pill { margin-bottom: 14px; }
    @keyframes pulseRing { 0% { opacity: .9; transform: scale(1) } 100% { opacity: 0; transform: scale(1.22) } }
    @media (prefers-reduced-motion: reduce) {
      .bal-btn::after { animation: none; }
    }

    /* ------------------------------------------------------------ blocks */
    .section-title {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
      color: var(--text2); margin: 20px 2px 10px;
    }
    .section-title .link { text-transform: none; letter-spacing: 0; font-size: 13px; color: #a5b4fc; font-weight: 600; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }

    .limits { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .limit {
      position: relative; overflow: hidden; border-radius: 16px; padding: 12px 11px 11px;
      background: var(--surface); border: 1px solid var(--border);
    }
    .limit-ico { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-size: 15px; color: #fff; margin-bottom: 10px; }
    .limit.k-fi .limit-ico { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .limit.k-rp .limit-ico { background: linear-gradient(135deg, var(--pink), #f43f5e); }
    .limit-value { font-size: 24px; font-weight: 800; line-height: 1; }
    .limit-value small { font-size: 12px; font-weight: 600; color: var(--text2); }
    .limit-label { font-size: 11px; color: var(--text2); margin-top: 5px; line-height: 1.3; }
    .limit.zero .limit-value { color: var(--red); }
    .bar { height: 4px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; margin-top: 9px; }
    .bar > div { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--green), #34d399); }

    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
    .stat { padding: 11px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); }
    .stat b { display: block; font-size: 17px; font-weight: 800; }
    .stat span { font-size: 11px; color: var(--text2); }

    .cta {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin-top: 10px;
      padding: 13px 14px; border-radius: 16px; border: 1px solid rgba(16, 185, 129, .3);
      background: linear-gradient(135deg, rgba(16, 185, 129, .14), rgba(99, 102, 241, .08)), var(--surface);
    }
    .cta .ico { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; color: #fff; background: linear-gradient(135deg, var(--green), #059669); flex: none; }
    .cta b { display: block; font-size: 14px; }
    .cta span { font-size: 12px; color: var(--text2); }

    /* ------------------------------------------------------------ lists */
    .item {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
      padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 8px;
    }
    .item-ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 17px; flex: none; background: var(--surface2); color: #c4b5fd; }
    .item-ico.green { background: rgba(16, 185, 129, .14); color: var(--green); }
    .item-ico.red { background: rgba(244, 63, 94, .14); color: var(--red); }
    .item-ico.gold { background: rgba(245, 158, 11, .14); color: var(--gold); }
    .item-ico.pink { background: rgba(236, 72, 153, .14); color: var(--pink); }
    .item-title { font-weight: 700; font-size: 14.5px; }
    .item-sub { font-size: 12px; color: var(--text2); margin-top: 3px; }
    .item-right { text-align: right; flex: none; }
    .delta { font-weight: 800; font-size: 15px; }
    .delta.minus { color: var(--red); }
    .delta.plus { color: var(--green); }
    .pill { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 3px 7px; border-radius: 7px; background: var(--surface2); color: var(--text2); }
    .pill.green { background: rgba(16, 185, 129, .15); color: var(--green); }
    .pill.gold { background: rgba(245, 158, 11, .16); color: var(--gold); }
    .pill.accent { background: rgba(99, 102, 241, .18); color: #a5b4fc; }

    .acc { padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 10px; }
    .acc.linked { border-color: rgba(99, 102, 241, .35); background: linear-gradient(135deg, rgba(99, 102, 241, .12), rgba(139, 92, 246, .05)), var(--surface); }
    .acc-actions { display: flex; gap: 8px; margin-top: 12px; }
    .acc-actions .btn { flex: 1; padding: 10px; font-size: 13px; }

    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 12px; }
    .seg button { padding: 9px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--text2); transition: background .2s, color .2s; }
    .seg button.active { color: #fff; background: linear-gradient(135deg, rgba(99, 102, 241, .5), rgba(139, 92, 246, .4)); }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
      padding: 13px; border-radius: 14px; font-weight: 700; background: var(--surface2); border: 1px solid var(--border);
    }
    .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; color: #fff; }
    .btn.green { background: linear-gradient(135deg, var(--green), #059669); border-color: transparent; color: #fff; }
    .btn.danger { background: rgba(244, 63, 94, .12); border-color: rgba(244, 63, 94, .32); color: var(--red); }
    .btn:disabled { opacity: .55; }
    /* Amal bajarilguncha tugma ichida spinner */
    .btn.busy, .link-btn.busy { position: relative; color: transparent !important; pointer-events: none; }
    .btn.busy:disabled { opacity: .85; }
    .btn.busy::after, .link-btn.busy::after {
      content: ""; position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
      border: 2.5px solid rgba(255, 255, 255, .25); border-top-color: #fff; animation: spin .7s linear infinite;
    }
    .btn.danger.busy::after, .link-btn.busy::after { border-color: rgba(244, 63, 94, .25); border-top-color: var(--red); }
    .btn + .btn { margin-top: 8px; }

    .empty { text-align: center; padding: 30px 16px; color: var(--text2); font-size: 13.5px; line-height: 1.5; }
    .empty .bi { display: block; font-size: 30px; margin-bottom: 8px; opacity: .6; }

    .fm-more { display: flex; justify-content: center; padding: 14px 0 4px; }
    .spinner { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--surface2); border-top-color: var(--accent); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .skeleton { border-radius: 14px; height: 62px; margin-bottom: 8px; background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
    @keyframes shimmer { to { background-position: -200% 0; } }

    /* ------------------------------------------------------------ sheet */
    .sheet-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); z-index: 30; animation: fade .2s both; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; overflow-y: auto;
      max-height: min(88vh, calc(100vh - var(--top-space, 0px) - 12px));
      background: var(--sheet); border-radius: 24px 24px 0 0; border-top: 1px solid var(--border);
      padding: 10px 16px calc(22px + var(--safe-bottom, 0px)); animation: sheetUp .32s cubic-bezier(.22, .8, .3, 1) both;
    }
    .sheet-inner { max-width: 560px; margin: 0 auto; }
    .sheet-handle { width: 40px; height: 5px; border-radius: 99px; background: var(--border); margin: 0 auto 14px; }
    .sheet h2 { font-size: 19px; font-weight: 800; margin-bottom: 4px; }
    .sheet .lead { font-size: 13px; color: var(--text2); margin-bottom: 16px; line-height: 1.45; }
    @keyframes sheetUp { from { transform: translateY(100%) } to { transform: none } }
    @keyframes sheetDown { from { transform: none } to { transform: translateY(100%) } }
    @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
    @keyframes fadeOut { from { opacity: 1 } to { opacity: 0 } }
    .sheet.closing { animation: sheetDown .24s cubic-bezier(.4, 0, .9, .6) both; }
    .sheet-backdrop.closing { animation: fadeOut .24s both; }
    .sheet-body { animation: popIn .26s cubic-bezier(.22, .8, .3, 1) both; }
    .detail-head { text-align: center; margin: 2px 0 14px; }
    .detail-head .item-ico { width: 56px; height: 56px; border-radius: 18px; font-size: 24px; margin: 0 auto 10px; }
    .detail-head h2 { word-break: break-all; }
    .item.tappable { cursor: pointer; }
    .item.tappable:active { transform: scale(.985); }

    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
    .field input {
      width: 100%; padding: 13px; border-radius: 12px; outline: none; color: var(--text);
      background: rgba(255, 255, 255, .05); border: 1px solid var(--border); font-size: 16px;
    }
    .field input:focus { border-color: var(--accent); }
    .field input.code { text-align: center; letter-spacing: .4em; font-size: 22px; font-weight: 800; }
    .fields2 { display: grid; grid-template-columns: 1.6fr 1fr; gap: 10px; }

    .price-group { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; margin: 16px 2px 8px; }
    .price {
      position: relative; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
      padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 8px;
    }
    .price.hit { border-color: rgba(245, 158, 11, .45); background: linear-gradient(135deg, rgba(245, 158, 11, .12), rgba(236, 72, 153, .05)), var(--surface); }
    .price-amount { font-size: 20px; font-weight: 800; line-height: 1; }
    .price-amount small { font-size: 12px; color: var(--text2); font-weight: 600; }
    .price-sum { font-weight: 800; font-size: 15px; color: var(--green); }
    .price-unit { font-size: 11px; color: var(--text2); margin-top: 3px; }

    .result { text-align: center; padding: 8px 4px 4px; }
    .result .big { width: 72px; height: 72px; border-radius: 24px; margin: 4px auto 14px; display: grid; place-items: center; font-size: 32px; color: #fff; background: linear-gradient(135deg, var(--green), #059669); }
    .result .big.warn { background: linear-gradient(135deg, var(--gold), var(--red)); }
    .result h2 { margin-bottom: 8px; }

    /* ------------------------------------------------------------ to'lov qabul qilindi (tabrik) */
    .cel {
      position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px;
      padding-top: calc(24px + var(--top-space, 0px)); padding-bottom: calc(24px + var(--safe-bottom, 0px));
      background: radial-gradient(circle at 50% 38%, rgba(16, 185, 129, .28), rgba(5, 8, 18, .9) 62%);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      animation: fade .3s both; overflow: hidden;
    }
    .cel.closing { animation: fadeOut .26s both; }
    .cel-card { position: relative; width: 100%; max-width: 340px; text-align: center; animation: celPop .55s cubic-bezier(.2, 1.3, .35, 1) .05s both; }
    .cel-ring { position: relative; width: 124px; height: 124px; margin: 0 auto 22px; }
    .cel-ring::before, .cel-ring::after {
      content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(16, 185, 129, .55);
      animation: celWave 1.8s ease-out .35s infinite;
    }
    .cel-ring::after { animation-delay: 1.25s; }
    .cel-ring svg { position: relative; width: 100%; height: 100%; filter: drop-shadow(0 10px 30px rgba(16, 185, 129, .55)); }
    .cel-ring .disc { fill: url(#celGrad); transform-origin: center; animation: celDisc .5s cubic-bezier(.2, 1.4, .4, 1) .1s both; }
    .cel-ring .tick { fill: none; stroke: #fff; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; animation: celTick .45s cubic-bezier(.65, 0, .35, 1) .5s forwards; }
    .cel-title { font-size: 15px; font-weight: 700; color: #a7f3d0; letter-spacing: .02em; text-transform: uppercase; animation: popIn .4s ease .55s both; }
    .cel-sum {
      margin: 8px 0 6px; font-size: 42px; line-height: 1.05; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums;
      background: linear-gradient(135deg, #ecfdf5, #6ee7b7 55%, #34d399); -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: popIn .45s ease .65s both;
    }
    .cel-sum small { font-size: 20px; font-weight: 700; }
    .cel-text { font-size: 15px; color: var(--text); line-height: 1.45; animation: popIn .45s ease .75s both; }
    .cel-bal { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; padding: 7px 14px; border-radius: 99px; background: rgba(255, 255, 255, .08); border: 1px solid var(--border); font-size: 13px; color: var(--text2); animation: popIn .45s ease .85s both; }
    .cel-bal b { color: var(--text); }
    .cel .btn { margin-top: 24px; animation: popIn .45s ease .95s both; }
    .cel-confetti { position: absolute; left: 50%; top: 38%; width: 0; height: 0; pointer-events: none; }
    .cel-confetti i {
      position: absolute; left: 0; top: 0; width: 9px; height: 14px; border-radius: 2px; opacity: 0;
      animation: celBurst var(--t, 1.6s) cubic-bezier(.15, .7, .3, 1) var(--d, 0s) forwards;
    }
    .cel-confetti i.dot { width: 8px; height: 8px; border-radius: 50%; }
    @keyframes celPop { from { opacity: 0; transform: translateY(24px) scale(.9) } to { opacity: 1; transform: none } }
    @keyframes celDisc { from { transform: scale(0) } to { transform: scale(1) } }
    @keyframes celTick { to { stroke-dashoffset: 0 } }
    @keyframes celWave { 0% { opacity: .8; transform: scale(1) } 100% { opacity: 0; transform: scale(1.7) } }
    @keyframes celBurst {
      0% { opacity: 1; transform: translate(0, 0) rotate(0) scale(.6) }
      70% { opacity: 1 }
      100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(1) }
    }
    @media (prefers-reduced-motion: reduce) {
      .cel, .cel-card, .cel-title, .cel-sum, .cel-text, .cel-bal, .cel .btn, .cel-ring .disc { animation: none; }
      .cel-ring::before, .cel-ring::after, .cel-confetti { display: none; }
      .cel-ring .tick { animation: none; stroke-dashoffset: 0; }
    }
    .result p { color: var(--text2); font-size: 13.5px; line-height: 1.5; margin-bottom: 18px; }

    .state { text-align: center; padding: 64px 12px; }
    .state .big { width: 76px; height: 76px; margin: 0 auto 16px; border-radius: 24px; display: grid; place-items: center; font-size: 34px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    .state h2 { font-size: 18px; margin-bottom: 8px; }
    .state p { color: var(--text2); line-height: 1.5; margin-bottom: 18px; }

    /* ------------------------------------------------------------ balans (hamyon) */
    .pill.red { background: rgba(244, 63, 94, .15); color: var(--red); }
    .chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
    .chip { padding: 12px 8px; border-radius: 13px; font-weight: 800; font-size: 15px; background: var(--surface2); border: 1px solid var(--border); }
    .chip.active { border-color: var(--green); background: rgba(16, 185, 129, .14); color: #6ee7b7; }
    .hint { font-size: 12px; color: var(--text2); margin: -4px 2px 14px; line-height: 1.45; }
    .paybox { border-radius: 16px; padding: 14px; background: rgba(255, 255, 255, .04); border: 1px solid var(--border); margin-bottom: 12px; }
    .payrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
    .payrow + .payrow { border-top: 1px dashed var(--border); }
    .payrow .k { font-size: 11.5px; color: var(--text2); font-weight: 600; }
    .payrow .v { font-size: 16px; font-weight: 800; letter-spacing: .3px; word-break: break-all; }
    .payrow .v.big { font-size: 24px; color: #6ee7b7; }
    .copy { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--surface2); border: 1px solid var(--border); font-size: 16px; }
    .warnbox { font-size: 12.5px; line-height: 1.45; padding: 10px 12px; border-radius: 12px; margin-bottom: 12px; color: #fcd34d; background: rgba(245, 158, 11, .1); border: 1px solid rgba(245, 158, 11, .28); }
    .waiting { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13px; color: var(--text2); margin: 4px 0 12px; }
    .waiting .spinner { width: 16px; height: 16px; border-width: 2px; }
    .creds { text-align: left; }
    .link-btn { display: block; margin: 10px auto 0; font-size: 13px; color: var(--text2); text-decoration: underline; }

    /* ------------------------------------------------------------ dock: tablar + alohida do'kon/asosiy tugmasi */
    .dock {
      position: fixed; left: 12px; right: 12px; bottom: calc(10px + var(--safe-bottom, 0px)); z-index: 20;
      max-width: 520px; margin: 0 auto; display: flex; align-items: stretch; gap: 8px;
    }
    .dock.shop { flex-direction: row-reverse; }
    .nav {
      position: relative; flex: 1; min-width: 0;
      display: grid; grid-template-columns: repeat(var(--tabs, 3), minmax(0, 1fr)); gap: 2px; padding: 6px;
      border-radius: 28px; background: rgba(22, 28, 48, .74); border: 1px solid rgba(255, 255, 255, .10);
      -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .06);
    }
    .nav button {
      position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 7px 0 6px; border-radius: 22px; font-size: 10.5px; font-weight: 600; color: var(--text2);
      transition: color .2s, transform .15s; -webkit-user-select: none; user-select: none;
    }
    .nav button:active { transform: scale(.94); }
    .nav button .bi { font-size: 20px; line-height: 1; }
    .nav button.active { color: #fff; }
    .nav button.active .bi { color: #c4b5fd; }
    .dock.shop .nav button.active .bi { color: #6ee7b7; }
    .nav-indicator {
      position: absolute; top: 6px; bottom: 6px; left: 0; width: 0; border-radius: 22px; opacity: 0; pointer-events: none; z-index: 0;
      background: linear-gradient(135deg, rgba(99, 102, 241, .34), rgba(139, 92, 246, .26));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), 0 4px 14px rgba(99, 102, 241, .25);
    }
    .dock.shop .nav-indicator {
      background: linear-gradient(135deg, rgba(16, 185, 129, .32), rgba(99, 102, 241, .22));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), 0 4px 14px rgba(16, 185, 129, .22);
    }
    .nav-indicator.ready { opacity: 1; transition: transform .42s cubic-bezier(.34, 1.36, .5, 1), width .42s cubic-bezier(.34, 1.36, .5, 1), opacity .2s; }

    /* Do'kon (asosiy rejimda o'ngda) / Asosiy (do'konda chapda) — appbardan ajralgan alohida tugma */
    .dock-side {
      position: relative; flex: none; width: 64px; border-radius: 26px; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      font-size: 10.5px; font-weight: 700; transition: transform .15s;
      -webkit-user-select: none; user-select: none;
    }
    .dock-side .bi { font-size: 21px; line-height: 1; }
    .dock-side:active { transform: scale(.92); }
    .dock-side.to-shop {
      background: linear-gradient(140deg, #10b981, #059669 55%, #6366f1);
      box-shadow: 0 10px 26px rgba(16, 185, 129, .42), inset 0 1px 0 rgba(255, 255, 255, .25);
    }
    .dock-side.to-shop::before {
      content: ""; position: absolute; inset: -3px; border-radius: 29px; pointer-events: none;
      border: 1.5px solid rgba(16, 185, 129, .5); animation: pulseRing 2.4s ease-out infinite;
    }
    .dock-side.to-shop .bi { animation: bagSwing 3.2s ease-in-out infinite; transform-origin: 50% 10%; }
    .dock-side.to-home {
      background: rgba(22, 28, 48, .74); border: 1px solid rgba(255, 255, 255, .10);
      -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .06);
    }
    .dock-side.to-home .bi { color: #c4b5fd; }
    @keyframes bagSwing { 0%, 70%, 100% { transform: rotate(0) } 76% { transform: rotate(-12deg) } 84% { transform: rotate(10deg) } 92% { transform: rotate(-5deg) } }

    /* Rejim almashinuvi: tugmadan butun ekranga yoyiladigan doira */
    .warp {
      position: fixed; inset: 0; z-index: 45; pointer-events: none; display: grid; place-items: center;
      clip-path: circle(0 at var(--wx, 50%) var(--wy, 100%));
    }
    .warp.shop { background: radial-gradient(120% 80% at 50% 40%, #0f5c4a 0%, #0b3a3a 40%, #0a0e1a 100%); }
    .warp.home { background: radial-gradient(120% 80% at 50% 40%, #2e2a6e 0%, #1a1a45 40%, #0a0e1a 100%); }
    .warp.in { animation: warpIn .46s cubic-bezier(.6, .05, .3, 1) both; }
    .warp.out { clip-path: circle(150% at var(--wx, 50%) var(--wy, 100%)); animation: warpOut .38s ease both; }
    .warp-ico {
      width: 92px; height: 92px; border-radius: 30px; display: grid; place-items: center; font-size: 42px; color: #fff;
      margin: 0 auto; /* yozuv (masalan "Shaxsiy kabinet") ikonadan keng bo'lsa ham markazda */
      background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .18);
      box-shadow: 0 20px 50px rgba(0, 0, 0, .35); animation: warpIco .5s cubic-bezier(.34, 1.56, .64, 1) .12s both;
    }
    .warp-label { margin-top: 14px; font-size: 17px; font-weight: 800; letter-spacing: .02em; color: #fff; text-align: center; animation: fade .3s .22s both; }
    @keyframes warpIn { from { clip-path: circle(0 at var(--wx, 50%) var(--wy, 100%)) } to { clip-path: circle(150% at var(--wx, 50%) var(--wy, 100%)) } }
    @keyframes warpOut { from { opacity: 1 } to { opacity: 0 } }
    @keyframes warpIco { from { opacity: 0; transform: scale(.4) rotate(-20deg) } to { opacity: 1; transform: none } }
    @keyframes popIn { from { opacity: 0; transform: translate3d(0, 14px, 0) scale(.98) } to { opacity: 1; transform: none } }
    @keyframes appPop { from { transform: translate3d(0, 14px, 0) scale(.98) } to { transform: none } }
    #app.pop-in { animation: appPop .4s cubic-bezier(.22, .8, .3, 1) both; }

    /* Donat — "Tez kunda!" ekran o'rtasida */
    .soon {
      min-height: calc(100vh - var(--top-space, 0px) - var(--safe-bottom, 0px) - 190px);
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    .soon .big {
      width: 84px; height: 84px; border-radius: 28px; display: grid; place-items: center; font-size: 38px; color: #fff; margin-bottom: 18px;
      background: linear-gradient(135deg, var(--gold), var(--pink)); box-shadow: 0 14px 36px rgba(236, 72, 153, .35);
      animation: floatY 3s ease-in-out infinite;
    }
    .soon h2 {
      font-size: 30px; font-weight: 800; letter-spacing: -.01em;
      background: linear-gradient(135deg, #fde68a, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .soon p { margin-top: 8px; color: var(--text2); font-size: 13.5px; line-height: 1.5; max-width: 280px; }
    @keyframes floatY { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }

    .pill.red { background: rgba(244, 63, 94, .15); color: var(--red); }

    /* Bo'lim almashinuvi. #app ning o'zi faqat siljiydi (transform). Unga opacity
       berilsa u "backdrop root"ga aylanadi: ichidagi kartalarning backdrop-filter
       blur'i animatsiya davomida orqa fon rasmini ko'rmaydi va rasm tiniq chiqib
       qoladi. Blurli kartaning o'zi ham so'ndirilmaydi (yarim shaffof karta
       ortidan tiniq rasm ko'rinadi) — u darhol blur bilan chiqadi va siljiydi,
       so'nish faqat kartalar ichidagi kontentga va blursiz bloklarga beriladi. */
    @keyframes slideFromRight { from { transform: translate3d(28px, 0, 0) } to { transform: none } }
    @keyframes slideFromLeft { from { transform: translate3d(-28px, 0, 0) } to { transform: none } }
    @keyframes appFade { from { opacity: 0 } to { opacity: 1 } }
    #app.slide-from-right { animation: slideFromRight .3s cubic-bezier(.22, .8, .3, 1) both; }
    #app.slide-from-left { animation: slideFromLeft .3s cubic-bezier(.22, .8, .3, 1) both; }
    @media (prefers-reduced-motion: no-preference) {
      #app:is(.slide-from-right, .slide-from-left, .pop-in) > :not(:is(.card, .limit, .stat, .item, .acc, .seg, .price, .cta, .paybox)):not(:has(.card, .limit, .stat, .item, .acc, .seg, .price, .cta, .paybox)),
      #app:is(.slide-from-right, .slide-from-left, .pop-in) :is(.card, .limit, .stat, .item, .acc, .seg, .price, .cta, .paybox) > :not(:is(.card, .limit, .stat, .item, .acc, .seg, .price, .cta, .paybox)) {
        animation: appFade .3s ease both;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      #app.slide-from-right, #app.slide-from-left, #app.pop-in, .sheet, .sheet-backdrop, .bg-blob, .soon .big,
      .dock-side.to-shop .bi, .dock-side.to-shop::before { animation: none; }
      .nav-indicator.ready { transition: none; }
    }

    .toast {
      /* Tepada — pastdagi oyna (sheet) tugmalari va input'larini yopmasin */
      position: fixed; left: 16px; right: 16px; top: calc(10px + var(--top-space, 0px)); z-index: 40;
      max-width: 520px; margin: 0 auto; padding: 12px 14px; border-radius: 14px;
      background: #1e2540; border: 1px solid var(--border); font-weight: 600; font-size: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .45); animation: fade .2s both;
    }

    /* Barcha karta/bo'limlar — kuchli blur (orqa fondagi rasm ustidan "chiqib" ketmasin) */
    .card, .limit, .stat, .item, .acc, .seg, .price, .cta, .paybox {
      -webkit-backdrop-filter: var(--surface-blur);
      backdrop-filter: var(--surface-blur);
    }
  </style>
</head>
